name: weave check
description: Fail a change that removes an endpoint something still calls, or leaves a requirement's test failing.
author: weave
branding:
  icon: git-branch
  color: gray-dark

inputs:
  root:
    description: Project root, relative to the workspace.
    required: false
    default: '.'
  strict-tests:
    description: Also fail when a touched endpoint has no direct test.
    required: false
    default: 'false'
  against:
    description: Git ref whose endpoint set is compared with this branch (needs fetch-depth 0).
    required: false
    default: origin/main

runs:
  using: composite
  steps:
    - name: Check node
      shell: bash
      run: |
        node --version
        node -e "const [a,b]=process.versions.node.split('.').map(Number);if(a<22||(a===22&&b<6)){console.error('weave needs Node >= 22.6');process.exit(1)}"

    - name: Index
      shell: bash
      run: node "${{ github.action_path }}/src/cli.ts" index --root "${{ inputs.root }}"

    - name: Check
      shell: bash
      run: |
        node "${{ github.action_path }}/src/cli.ts" check --root "${{ inputs.root }}" --against "${{ inputs.against }}"
        if [ "${{ inputs.strict-tests }}" = "true" ]; then
          node "${{ github.action_path }}/src/cli.ts" check --root "${{ inputs.root }}" --against "${{ inputs.against }}" --strict-tests
        fi

    - name: Coverage
      if: always()
      shell: bash
      run: node "${{ github.action_path }}/src/cli.ts" doctor --root "${{ inputs.root }}"
