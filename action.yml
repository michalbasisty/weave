name: weave check
description: Fail a change that removes an endpoint something still calls, or leaves a requirement's test failing.
author: weave
branding:
  icon: git-branch
  color: gray-dark

inputs:
  root:
    description: Project root, relative to the workspace.
    required: false
    default: '.'
  strict-tests:
    description: Also fail when a touched endpoint has no direct test.
    required: false
    default: 'false'
  against:
    description: >-
      Git ref whose endpoint set is compared with this branch. Needs fetch-depth 0:
      a shallow checkout has no merge base and the check exits 2.
    required: false
    default: origin/main

  comment:
    description: >-
      Comment on the pull request with what the change breaks, a diagram of the screens,
      endpoints and tables it reaches, and the tests to run. on-change (default) posts when
      the check fails or the change reaches an endpoint, and keeps that one comment current;
      on-failure posts only when the check fails; a run that could not gate posts its
      diagnosis in either mode; always posts every time; false never comments.
      Needs `pull-requests: write`.
    required: false
    default: on-change
  github-token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}

  sarif:
    description: >-
      Upload `weave check --format sarif` to GitHub code scanning. Off by default;
      enabling it runs `weave check` twice, once for the markdown report and once for
      SARIF. An upload needs `security-events: write`, a nonempty `against` (fetch-depth 0),
      `root: '.'` (or an equivalent `./`), and a gate that ran (exit 0 or 1). A fork pull
      request (read-only token), a missing `against`, a different root, or exit 2 skips
      the upload with a warning. The upload step is continue-on-error: a missing
      `security-events: write`, a failed upload, or an empty/invalid SARIF report adds a
      warning only and never masks the markdown report, PR comment or the gate's failing
      exit code. The `sarif-file` output names the report whenever one is produced.
    required: false
    default: 'false'

  wiki:
    description: Fail when the committed wiki (docs/wiki) no longer describes this tree. Run `weave wiki --out docs/wiki` locally first.
    required: false
    default: 'false'

outputs:
  sarif-file:
    description: >-
      Path to the SARIF 2.1.0 report when `sarif` is enabled and the run is uploadable;
      empty when the upload was skipped.
    value: ${{ steps.check.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: false

    - name: Build weave
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/weave"
        if [ "${RUNNER_OS:-}" = "Windows" ]; then bin="$bin.exe"; fi
        (cd "$GITHUB_ACTION_PATH" && go build -trimpath -ldflags "-s -w" -o "$bin" ./cmd/weave)
        printf 'WEAVE_BIN=%s\n' "$bin" >> "$GITHUB_ENV"

    - name: Index
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      run: '"$WEAVE_BIN" index --root "$ROOT"'

    - name: Check
      id: check
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        AGAINST: ${{ inputs.against }}
        STRICT_TESTS: ${{ inputs.strict-tests }}
        SARIF: ${{ inputs.sarif }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: |
        set -uo pipefail
        args=(check --root "$ROOT")
        if [ -n "$AGAINST" ]; then args+=(--against "$AGAINST"); fi
        if [ "$STRICT_TESTS" = "true" ]; then args+=(--strict-tests); fi
        report="$RUNNER_TEMP/weave-check.md"
        "$WEAVE_BIN" "${args[@]}" --markdown > "$report"
        rc=$?
        cat "$report"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        failed=false
        operational=false
        if [ "$rc" -eq 1 ]; then failed=true; fi
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then operational=true; fi
        reaches=false
        if grep -q '^```mermaid' "$report"; then reaches=true; fi
        sarif_file=""
        root_is_repo=false
        case "$ROOT" in
          ''|/*|*[!./]*) ;;
          *..*) ;;
          *.*) root_is_repo=true ;;
        esac
        if [ "$SARIF" = "true" ]; then
          if [ "$operational" = "true" ]; then
            echo "::warning::weave SARIF upload skipped: the gate could not run (exit $rc)"
          elif [ -z "$AGAINST" ]; then
            echo "::warning::weave SARIF upload skipped: against must name a git ref (fetch-depth 0)"
          elif [ "$root_is_repo" != "true" ]; then
            echo "::warning::weave SARIF upload skipped: root must be '.' or './' so SARIF paths match the repository"
          elif [ "$FORK" = "true" ]; then
            echo "::warning::weave SARIF upload skipped: pull requests from forks get a read-only token"
          else
            sarif_file="$RUNNER_TEMP/weave.sarif"
            "$WEAVE_BIN" "${args[@]}" --format sarif > "$sarif_file"
            sarif_rc=$?
            if [ "$sarif_rc" -ne 0 ] && [ "$sarif_rc" -ne 1 ]; then
              echo "::warning::weave SARIF report could not be rendered (exit $sarif_rc); skipping the upload"
              rm -f "$sarif_file"
              sarif_file=""
            elif [ ! -s "$sarif_file" ] \
              || ! grep -Eq '"version"[[:space:]]*:[[:space:]]*"2\.1\.0"' "$sarif_file" \
              || ! grep -Eq '"runs"[[:space:]]*:[[:space:]]*\[' "$sarif_file"; then
              echo "::warning::weave SARIF report is empty or invalid (exit $sarif_rc); skipping the upload"
              rm -f "$sarif_file"
              sarif_file=""
            fi
          fi
        fi
        printf 'report=%s\nfailed=%s\noperational=%s\nreaches=%s\nrc=%s\nsarif=%s\n' "$report" "$failed" "$operational" "$reaches" "$rc" "$sarif_file" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF to code scanning
      id: sarif
      if: ${{ steps.check.outputs.sarif != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.check.outputs.sarif }}

    - name: Warn when the SARIF upload failed
      if: ${{ steps.sarif.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::warning::weave could not upload SARIF to code scanning (needs security-events: write; fork pull requests are read-only). The gate verdict and comment are unaffected."

    - name: Comment on the pull request
      if: ${{ github.event.pull_request && inputs.comment != 'false' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MODE: ${{ inputs.comment }}
        FAILED: ${{ steps.check.outputs.failed }}
        OPERATIONAL: ${{ steps.check.outputs.operational }}
        REACHES: ${{ steps.check.outputs.reaches }}
        REPORT: ${{ steps.check.outputs.report }}
      run: |
        set -uo pipefail
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- weave-check -->")) | .id' 2>/dev/null | head -n1)
        post=false
        case "$MODE" in
          always) post=true ;;
          on-change) { [ "$FAILED" = "true" ] || [ "$REACHES" = "true" ] || [ "$OPERATIONAL" = "true" ]; } && post=true ;;
          *) { [ "$FAILED" = "true" ] || [ "$OPERATIONAL" = "true" ]; } && post=true ;;
        esac
        if [ "$post" != "true" ] && [ -z "$existing" ]; then
          echo "nothing to report and no earlier comment: nothing to post"
          exit 0
        fi
        body=$(jq -Rs '{body: .}' < "$REPORT")
        if [ -n "$existing" ]; then
          echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input - > /dev/null \
            || echo "::warning::weave could not update its PR comment (needs pull-requests: write)"
        else
          echo "$body" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null \
            || echo "::warning::weave could not comment on the PR (needs pull-requests: write)"
        fi

    - name: Fail when the gate could not run
      if: ${{ steps.check.outputs.operational == 'true' }}
      shell: bash
      run: |
        echo "::error::weave check could not run (bad --against ref, git range or change set) — see the report above"
        exit 1

    - name: Fail on problems
      if: ${{ steps.check.outputs.failed == 'true' }}
      shell: bash
      run: |
        echo "::error::weave check found problems — see the report above"
        exit 1

    - name: Coverage
      if: always()
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      run: '"$WEAVE_BIN" doctor --root "$ROOT"'

    - name: Wiki is current
      if: ${{ inputs.wiki == 'true' }}
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      run: |-
        set -euo pipefail
        root="$ROOT"
        "$WEAVE_BIN" wiki --root "$root" --out docs/wiki
        if ! git -C "$root" diff --quiet -- docs/wiki; then
          echo "::error::docs/wiki describes an older tree. Commit the regenerated pages."
          git -C "$root" --no-pager diff --stat -- docs/wiki
          exit 1
        fi
