<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-label="Two measured comparisons: a route question answers in 66 tokens where grep returns no hits; a file's context answers in 346 tokens where reading the same facts costs 61687.">
  <style>
    :root { --ground:#f5f6f8; --surface:#ffffff; --ink:#131a26; --ink2:#3a4454; --ink3:#5a6474;
            --rule:#dbe0e8; --rule2:#e8ebf0; --weave:#1d4bb0; --grep:#b4261a; --ok:#17723f; }
    @media (prefers-color-scheme: dark) {
      :root { --ground:#0b111d; --surface:#101827; --ink:#e8ecf3; --ink2:#bcc5d4; --ink3:#8f9bb0;
              --rule:#22304a; --rule2:#1a2439; --weave:#9cb9f5; --grep:#f2907f; --ok:#4cc493; }
    }
    .bg { fill: var(--ground); }
    .panel { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
    .h { font: 600 17px "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
    .sub { font: 400 13px "Segoe UI", system-ui, sans-serif; fill: var(--ink3); }
    .k { font: 600 12px "Segoe UI", system-ui, sans-serif; fill: var(--ink3); letter-spacing: .1em; }
    .num { font: 700 30px "Cascadia Mono", Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .weaveT { fill: var(--weave); }
    .grepT { fill: var(--grep); }
    .track { fill: var(--rule2); }
    .barW { fill: var(--weave); }
    .barG { fill: var(--grep); }
    .note { font: 400 12px "Cascadia Mono", Consolas, ui-monospace, monospace; fill: var(--ink3); }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="372" rx="10"/>

  <!-- left: the question grep cannot answer -->
  <rect class="panel" x="24" y="24" width="560" height="324" rx="8"/>
  <text class="h" x="52" y="64">Where is GET /api/v1/tasks/:id handled?</text>
  <text class="sub" x="52" y="88">The source writes /:id under a mount, so the literal never appears.</text>

  <text class="k" x="52" y="132">GREP</text>
  <text class="num grepT" x="52" y="170">0 hits</text>
  <text class="note" x="52" y="194">nothing to read — the route is not a string in the code</text>

  <text class="k" x="52" y="240">WEAVE</text>
  <text class="num weaveT" x="52" y="278">66 tokens</text>
  <text class="note" x="52" y="302">GET /api/v1/tasks/:id  tasks.routes.ts:155</text>

  <!-- right: the context pack -->
  <rect class="panel" x="616" y="24" width="560" height="324" rx="8"/>
  <text class="h" x="644" y="64">What do I need to know before editing this screen?</text>
  <text class="sub" x="644" y="88">Same facts, two ways, measured over 24 screens.</text>

  <text class="k" x="644" y="132">READ THE FILES</text>
  <rect class="track" x="644" y="144" width="504" height="16" rx="4"/>
  <rect class="barG" x="644" y="144" width="504" height="16" rx="4"/>
  <text class="num grepT" x="644" y="192">61,687 tokens</text>
  <text class="note" x="644" y="214">11 files: the screen, its endpoints, their tests</text>

  <text class="k" x="644" y="252">WEAVE CONTEXT</text>
  <rect class="track" x="644" y="264" width="504" height="16" rx="4"/>
  <rect class="barW" x="644" y="264" width="4" height="16" rx="2"/>
  <text class="num weaveT" x="644" y="312">346 tokens</text>
  <text class="note" x="644" y="334">page, endpoints, tables, owning change, tests + the command · bars to scale</text>
</svg>
