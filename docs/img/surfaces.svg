<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="One index built from the source feeds four doors: the gate for CI and the Stop hook, the panel for people, the wiki for readers and the MCP server for agents.">
  <style>
    :root { --ground:#f5f6f8; --surface:#ffffff; --ink:#131a26; --ink2:#3a4454; --ink3:#5a6474;
            --rule:#dbe0e8; --shell:#14233f; --shellink:#ffffff; --screen:#2a5cc4; --api:#12805a; --mod:#a8650a; --data:#8a3ea8; }
    @media (prefers-color-scheme: dark) {
      :root { --ground:#0b111d; --surface:#101827; --ink:#e8ecf3; --ink2:#bcc5d4; --ink3:#8f9bb0;
              --rule:#22304a; --shell:#18294f; --shellink:#ffffff; --screen:#7fa4f0; --api:#4cc493; --mod:#e0a24f; --data:#c28ae0; }
    }
    .bg { fill: var(--ground); }
    .box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
    .shell { fill: var(--shell); }
    .title { font: 600 20px "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
    .sub { font: 400 14px "Segoe UI", system-ui, sans-serif; fill: var(--ink3); }
    .kicker { font: 600 12px "Segoe UI", system-ui, sans-serif; fill: var(--ink3); letter-spacing: .12em; }
    .body { font: 400 15px "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
    .mono { font: 400 13px "Cascadia Mono", Consolas, ui-monospace, monospace; fill: var(--ink2); }
    .onDark { fill: var(--shellink); font: 600 16px "Segoe UI", system-ui, sans-serif; }
    .onDark2 { fill: var(--shellink); font: 400 13px "Segoe UI", system-ui, sans-serif; opacity: .8; }
    .wire { stroke-width: 8; stroke-linecap: round; fill: none; }
    .arrow { stroke: var(--ink3); stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink3)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="360" rx="10"/>
  <text class="title" x="40" y="44">One index, four doors</text>
  <text class="sub" x="40" y="68">Everything weave shows is read from the same graph, so the gate, the panel, the wiki and the agent cannot disagree.</text>

  <!-- the index -->
  <rect class="shell" x="40" y="104" width="330" height="200" rx="8"/>
  <text class="onDark" x="64" y="136">the index</text>
  <text class="onDark2" x="64" y="158">built from source, one static binary</text>
  <path class="wire" d="M64 190 H116" stroke="var(--screen)"/>
  <path class="wire" d="M132 190 H184" stroke="var(--api)"/>
  <path class="wire" d="M200 190 H252" stroke="var(--mod)"/>
  <path class="wire" d="M268 190 H320" stroke="var(--data)"/>
  <text class="onDark2" x="64" y="218">screens</text>
  <text class="onDark2" x="132" y="218">endpoints</text>
  <text class="onDark2" x="206" y="218">modules</text>
  <text class="onDark2" x="270" y="218">tables</text>
  <text class="onDark2" x="64" y="256">+ change records, tests, requirements</text>
  <text class="onDark2" x="64" y="278">+ what it could not parse</text>

  <!-- arrows -->
  <path class="arrow" d="M382 150 H452"/>
  <path class="arrow" d="M382 204 H452"/>
  <path class="arrow" d="M382 258 H452"/>

  <!-- four doors -->
  <rect class="box" x="464" y="104" width="340" height="44" rx="6"/>
  <text class="body" x="482" y="132"><tspan font-weight="600">Gate</tspan> · weave check · exit 1 on a broken call</text>
  <rect class="box" x="464" y="158" width="340" height="44" rx="6"/>
  <text class="body" x="482" y="186"><tspan font-weight="600">Panel</tspan> · weave serve · map, specs, notes</text>
  <rect class="box" x="464" y="212" width="340" height="44" rx="6"/>
  <text class="body" x="482" y="240"><tspan font-weight="600">Wiki</tspan> · weave wiki · a page per thing</text>
  <rect class="box" x="464" y="266" width="340" height="44" rx="6"/>
  <text class="body" x="482" y="294"><tspan font-weight="600">Agent</tspan> · weave mcp · 13 tools, 1,308 tokens</text>

  <!-- who -->
  <text class="kicker" x="836" y="124">CI, STOP HOOK, PRE-COMMIT</text>
  <text class="kicker" x="836" y="178">THE PERSON CHECKING THE WORK</text>
  <text class="kicker" x="836" y="232">NEW TEAMMATES, REVIEWERS</text>
  <text class="kicker" x="836" y="286">CLAUDE, CURSOR, VS CODE, OPENCODE</text>
  <text class="mono" x="836" y="142">no model in the loop</text>
  <text class="mono" x="836" y="196">loopback only, local</text>
  <text class="mono" x="836" y="250">generated, stamped with a commit</text>
  <text class="mono" x="836" y="304">answers end with their cost</text>
</svg>
