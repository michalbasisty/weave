<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="The gate: an agent claims done, weave check exits 1 naming the caller's file and line, the agent keeps working; when the call is fixed the exit code is 0 and the change ships.">
  <style>
    :root { --ground:#f5f6f8; --surface:#ffffff; --ink:#131a26; --ink2:#3a4454; --ink3:#5a6474;
            --rule:#dbe0e8; --shell:#14233f; --shellink:#ffffff; --ok:#17723f; --bad:#b4261a; --link:#1d4bb0; }
    @media (prefers-color-scheme: dark) {
      :root { --ground:#0b111d; --surface:#101827; --ink:#e8ecf3; --ink2:#bcc5d4; --ink3:#8f9bb0;
              --rule:#22304a; --shell:#18294f; --shellink:#ffffff; --ok:#4cc493; --bad:#f2907f; --link:#9cb9f5; }
    }
    .bg { fill: var(--ground); }
    .box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
    .shell { fill: var(--shell); }
    .kicker { font: 600 12px "Segoe UI", system-ui, sans-serif; fill: var(--ink3); letter-spacing: .12em; }
    .body { font: 400 15px "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
    .body-2 { font: 400 13px "Segoe UI", system-ui, sans-serif; fill: var(--ink3); }
    .mono { font: 400 13px "Cascadia Mono", Consolas, ui-monospace, monospace; fill: var(--ink2); }
    .onDark { fill: var(--shellink); font: 600 15px "Cascadia Mono", Consolas, ui-monospace, monospace; }
    .arrow { stroke: var(--ink3); stroke-width: 2; fill: none; marker-end: url(#a); }
    .bad .body { fill: var(--bad); font-weight: 600; }
    .bad { fill: var(--bad); }
    .ok { fill: var(--ok); }
    .okT { fill: var(--ok); font: 600 14px "Segoe UI", system-ui, sans-serif; }
    .badT { fill: var(--bad); font: 600 14px "Segoe UI", system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink3)"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ok)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="300" rx="10"/>

  <rect class="box" x="28" y="52" width="248" height="92" rx="6"/>
  <text class="kicker" x="48" y="80">THE AGENT SAYS</text>
  <text class="body" x="48" y="108">“Done. Renamed the route</text>
  <text class="body" x="48" y="128">and updated the callers.”</text>

  <path class="arrow" d="M288 98 H352"/>

  <rect class="shell" x="364" y="52" width="196" height="92" rx="6"/>
  <text class="onDark" x="462" y="104" text-anchor="middle">weave check</text>

  <path class="arrow" d="M572 98 H636"/>

  <rect class="box" x="648" y="40" width="524" height="116" rx="6" stroke="var(--bad)"/>
  <text class="kicker" x="668" y="66">EXIT 1 — THE CONTRACT IS BROKEN</text>
  <text class="mono" x="668" y="92">removed endpoint still called:</text>
  <text class="mono" x="668" y="112">POST /api/v1/tasks/:id/push-action</text>
  <text class="mono" x="668" y="132">from packages/web/public/sw.js:172</text>

  <path class="arrow" d="M400 156 V206 H636" transform="translate(0,0)"/>
  <text class="body-2" x="648" y="210">the turn does not end; the agent fixes the call site</text>
  <path d="M640 204 H478 Q466 204 466 192 V152" fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text class="okT" x="462" y="262" text-anchor="middle">exit 0 → the change ships</text>
  <text class="badT" x="910" y="262" text-anchor="middle">exit 1 → the claim of “done” is not accepted</text>
</svg>
