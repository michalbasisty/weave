  <text class="group" x="40" y="136">documenso<tspan class="note" dx="12">327 endpoints · Remix + tRPC + Prisma monorepo</tspan></text><text class="label" x="196" y="165" text-anchor="end">grep</text><line class="rule" x1="210" x2="210" y1="147" y2="173"/><path class="a" d="M210,150 h54.5 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-54.5 z"/><text class="value" x="278.5" y="165">9%  (30 of 327)</text><text class="label" x="196" y="195" text-anchor="end">weave</text><line class="rule" x1="210" x2="210" y1="177" y2="203"/><path class="w" d="M210,180 h646 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-646 z"/><text class="value" x="870" y="195">100%  (327 of 327)</text><text class="group" x="40" y="246">RealWorld · NestJS<tspan class="note" dx="12">21 endpoints · NestJS + TypeORM API</tspan></text><text class="label" x="196" y="275" text-anchor="end">grep</text><line class="rule" x1="210" x2="210" y1="257" y2="283"/><path class="a" d="M210,260 h1.5 a1.5,1.5 0 0 1 1.5,1.5 v17 a1.5,1.5 0 0 1 -1.5,1.5 h-1.5 z"/><text class="value" x="223" y="275">0%  (0 of 21)</text><text class="label" x="196" y="305" text-anchor="end">weave</text><line class="rule" x1="210" x2="210" y1="287" y2="313"/><path class="w" d="M210,290 h646 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-646 z"/><text class="value" x="870" y="305">100%  (21 of 21)</text><text class="group" x="40" y="356">RealWorld · Express + React<tspan class="note" dx="12">20 endpoints · Express + Prisma backend, React + Redux front end</tspan></text><text class="label" x="196" y="385" text-anchor="end">grep</text><line class="rule" x1="210" x2="210" y1="367" y2="393"/><path class="a" d="M210,370 h646 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-646 z"/><text class="value" x="870" y="385">100%  (20 of 20)</text><text class="label" x="196" y="415" text-anchor="end">weave</text><line class="rule" x1="210" x2="210" y1="397" y2="423"/><path class="w" d="M210,400 h646 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-646 z"/><text class="value" x="870" y="415">100%  (20 of 20)</t