<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Renaming each of 15 called routes: weave check failed and named the caller 14 times.">

  <style>
    :root { --bg:#ffffff; --ink:#131a26; --ink2:#3a4454; --ink3:#5a6474; --rule:#e3e7ee; --weave:#2456c7; --alt:#c2621c; --none:#d5dae3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#e8ecf3; --ink2:#c3cad6; --ink3:#8f9bb0; --rule:#222b3a; --weave:#5b86e6; --alt:#cf7434; --none:#2a3344; }
    }
    .bg { fill: var(--bg); }
    .title { font: 600 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .sub { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink3); }
    .group { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .label { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); }
    .value { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--ink); font-variant-numeric: tabular-nums; }
    .note { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink3); }
    .rule { stroke: var(--rule); stroke-width: 1; }
    .w { fill: var(--weave); } .a { fill: var(--alt); } .n { fill: var(--none); }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="250" rx="12"/>
  <text class="title" x="40" y="48">Rename a route, and the gate names who still calls it</text>
  <text class="sub" x="40" y="74">Each of the 15 routes the RealWorld front end calls, renamed one at a time, then weave check</text>
  <text class="value" x="40" y="104">14 of 15 failed with the caller's file:line</text>
  <rect class="w" x="40" y="120" width="52" height="52" rx="6"><title>GET /articles: caught, caller named</title></rect><path d="M55,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="n" x="100" y="120" width="52" height="52" rx="6"><title>GET /articles/feed: not caught</title></rect><rect class="w" x="160" y="120" width="52" height="52" rx="6"><title>POST /articles: caught, caller named</title></rect><path d="M175,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="220" y="120" width="52" height="52" rx="6"><title>GET /articles/:slug: caught, caller named</title></rect><path d="M235,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="280" y="120" width="52" height="52" rx="6"><title>PUT /articles/:slug: caught, caller named</title></rect><path d="M295,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="340" y="120" width="52" height="52" rx="6"><title>GET /articles/:slug/comments: caught, caller named</title></rect><path d="M355,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="400" y="120" width="52" height="52" rx="6"><title>POST /articles/:slug/comments: caught, caller named</title></rect><path d="M415,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="460" y="120" width="52" height="52" rx="6"><title>POST /articles/:slug/favorite: caught, caller named</title></rect><path d="M475,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="520" y="120" width="52" height="52" rx="6"><title>POST /users: caught, caller named</title></rect><path d="M535,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="580" y="120" width="52" height="52" rx="6"><title>POST /users/login: caught, caller named</title></rect><path d="M595,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="640" y="120" width="52" height="52" rx="6"><title>GET /user: caught, caller named</title></rect><path d="M655,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="700" y="120" width="52" height="52" rx="6"><title>PUT /user: caught, caller named</title></rect><path d="M715,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="760" y="120" width="52" height="52" rx="6"><title>GET /profiles/:username: caught, caller named</title></rect><path d="M775,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="820" y="120" width="52" height="52" rx="6"><title>POST /profiles/:username/follow: caught, caller named</title></rect><path d="M835,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="w" x="880" y="120" width="52" height="52" rx="6"><title>GET /tags: caught, caller named</title></rect><path d="M895,147 l8,8 l15,-17" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="note" x="40" y="204">Not caught: GET /articles/feed. Its caller now lands on a parameter route (/articles/:slug), which is what Express would do too.</text>
  <text class="note" x="40" y="226">No type checker sees this: the route and its callers only share a string.</text>
</svg>
