  <text class="note" x="40" y="458">Not caught: GET /articles/feed, whose caller then lands on /articles/:slug, and a Gin route declared twice (/:slug and /:slug/).</text>
  <text class="note" x="40" y="480">The harmless edit is a blank line under the route. No type checker sees any of this: a route and its callers only share a string.</text>
