<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-label="Breaking each route the RealWorld front end calls, on six back ends: weave check failed and named the caller 170 of 188 times; 72 of 72 harmless edits passed.">

  <style>
    :root { --bg:#ffffff; --ink:#131a26; --ink2:#3a4454; --ink3:#5a6474; --rule:#e3e7ee; --weave:#2456c7; --alt:#c2621c; --none:#d5dae3; }
    @media (prefers-color-scheme: dark) {
