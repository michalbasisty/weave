name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Build every target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath \
              -ldflags "-s -w -X github.com/michalbasisty/weave/internal/version.Version=${GITHUB_REF_NAME#v}" \
              -o "dist/weave-$os-$arch$ext" ./cmd/weave
          done
          # the OpenChamber extension, installable from its release URL (Settings → Extensions)
          (cd extensions && zip -qr ../dist/weave-openchamber.zip openchamber)
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
