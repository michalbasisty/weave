name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/weave

  panel:
    name: panel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Headless Chrome
        run: google-chrome --version
      - run: node test/ui/panel.mjs

  action:
    name: action on the fixture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          root: test/fixture
          against: ''
