name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/weave
