<style>
:root{
  /* type: the system UI family; mono only for routes, tables, paths and counts */
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --fs-xs:.75rem;--fs-s:.8125rem;--fs-c:.875rem;--fs-m:.9375rem;--fs-l:1.125rem;--fs-xl:1.375rem;--fs-2xl:1.75rem;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r:8px;--list:380px;--side:224px;
  --ground:#f6f7f9;--surface:#ffffff;--sunk:#f0f2f5;--hover:#f3f5f8;
  --ink:#111827;--ink2:#374151;--ink3:#6b7280;
  --rule:#e3e6eb;--rule2:#eef0f3;
  /* the header and sidebar share the page's surface; the old navy signboard is gone */
  --shell:#ffffff;--shell-ink:#111827;--shell-ink2:#4b5563;--shell-field:#f3f4f6;--shell-rule:#e3e6eb;
  --accent:#3b5bdb;--accent-bg:#edf1fd;
  --link:#2f4fc4;--focus:#3b5bdb;
  --screen:#2a5cc4;--api:#12805a;--module:#a8650a;--data:#8a3ea0;
  --ok:#17723f;--ok-bg:#eaf6ef;--bad:#b4261a;--bad-bg:#fdeeec;
  --sel:#c8d7f6;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  color-scheme:light;
}
:root[data-theme=dark]{
  --ground:#0d1117;--surface:#151b23;--sunk:#1c2430;--hover:#1a212b;
  --ink:#e6e9ef;--ink2:#c0c7d2;--ink3:#8b95a5;
  --rule:#2a313c;--rule2:#20262f;
  --shell:#151b23;--shell-ink:#e6e9ef;--shell-ink2:#aab3c0;--shell-field:#1c2430;--shell-rule:#2a313c;
  --accent:#8ea8ff;--accent-bg:#1e2742;
  --link:#9cb4ff;--focus:#9cb4ff;
  --screen:#7aa2f2;--api:#4cc493;--module:#e3a64c;--data:#c992dc;
  --ok:#62cf91;--ok-bg:#15291e;--bad:#f2907f;--bad-bg:#2c1816;
  --sel:#2b4475;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--rule) transparent}
body{margin:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--ground);color:var(--ink);font:var(--fs-m)/1.5 var(--ui);-webkit-font-smoothing:antialiased;caret-color:var(--link)}
::selection{background:var(--sel);color:var(--ink)}
a{color:var(--link);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
code,kbd{font:.9em var(--mono)}
kbd{border:1px solid var(--rule);border-radius:4px;padding:0 5px;color:var(--ink2);background:var(--surface)}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:var(--r);padding:10px 14px;font-size:var(--fs-s)}
.skip:focus{left:8px}
.ico{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ico .fill{fill:currentColor;stroke:none}
.cn{font:500 var(--fs-xs) var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}

/* ------------------------------------------------ header */
.top{display:flex;align-items:center;gap:var(--s4);min-height:56px;padding:0 var(--s4) 0 var(--s5);background:var(--shell);color:var(--shell-ink);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;width:calc(var(--side) - var(--s5) - var(--s4));font:700 var(--fs-l)/1 var(--display);color:var(--ink);letter-spacing:-.02em}
.brand:hover{text-decoration:none}
.logo{width:22px;height:22px;fill:var(--surface);stroke:var(--accent);stroke-width:1.7}
#proj{height:34px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0 var(--s2);font:var(--fs-s) var(--ui);max-width:200px}
#proj[hidden]{display:none}
.find{position:relative;display:flex;align-items:center;flex:1 1 auto;max-width:520px}
.find .ico{position:absolute;left:11px;color:var(--ink3);pointer-events:none}
#q{width:100%;height:36px;padding:0 34px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sunk);color:var(--ink);font:var(--fs-c) var(--ui);caret-color:var(--accent)}
#q::placeholder{color:var(--ink3);opacity:1}
#q:focus{outline:2px solid var(--focus);outline-offset:0;background:var(--surface)}
.key{position:absolute;right:8px;background:var(--surface);color:var(--ink3)}
.themebtn{display:flex;align-items:center;gap:6px;margin-left:auto;min-height:34px;padding:0 var(--s3);border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);color:var(--ink2);font-size:var(--fs-s);cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink3)}

/* ------------------------------------------------ frame: sidebar + content */
.frame{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:0}
.content{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.tabs{display:flex;flex-direction:column;gap:2px;padding:var(--s3) var(--s3) var(--s5);background:var(--surface);border-right:1px solid var(--rule);overflow:auto}
.tabs a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:6px;color:var(--ink2);font:500 var(--fs-c) var(--ui)}
.tabs a .ico{color:var(--ink3)}
.tabs a:hover{background:var(--hover);color:var(--ink);text-decoration:none}
.tabs a[aria-current=page]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tabs a[aria-current=page] .ico{color:var(--accent)}
.tabs .tl{flex:1 1 auto;min-width:0}
.tabs .tn{font:500 var(--fs-xs) var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.tabs .dot{width:10px;height:10px;margin:0 3px;border-radius:50%;border:2.5px solid var(--ln);flex:0 0 auto}
.tabs a[aria-current=page] .dot{background:var(--ln)}
.navh{margin:var(--s4) 10px var(--s1);font:600 var(--fs-xs) var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.tc{margin-left:auto;font:600 var(--fs-xs)/1 var(--mono);padding:3px 7px;border-radius:999px;background:var(--sunk);color:var(--ink3);font-variant-numeric:tabular-nums}
.tc.bad{background:var(--bad);color:#fff}

/* ------------------------------------------------ breadcrumb: you are here */
.crumbs{display:flex;align-items:center;gap:var(--s4);min-height:44px;padding:0 var(--s5);background:var(--ground);border-bottom:1px solid var(--rule)}
.crumbs ol{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin:0;padding:0;list-style:none;min-width:0;font-size:var(--fs-s)}
.crumbs li{display:flex;align-items:center;gap:2px;min-width:0}
.crumbs a{display:inline-flex;align-items:center;min-height:32px;padding:0 4px;color:var(--ink3)}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink3);width:14px;height:14px}
.crumbs .upico{display:none}
.crumbs [aria-current=page]{color:var(--ink);font-weight:600;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60ch}
.stamp{margin-left:auto;font:var(--fs-xs) var(--ui);color:var(--ink3);white-space:nowrap}

/* ------------------------------------------------ panes */
main{display:grid;grid-template-columns:minmax(300px,var(--list)) minmax(0,1fr);min-height:0}
main:focus{outline:0}
main.solo{grid-template-columns:minmax(0,1fr)}
#list{overflow:auto;min-height:0;background:var(--surface);border-right:1px solid var(--rule);padding-bottom:var(--s6)}
main.solo #list{display:none}
#detail{overflow:auto;min-height:0}
[data-lane=screen]{--ln:var(--screen)}
[data-lane=api]{--ln:var(--api)}
[data-lane=module]{--ln:var(--module)}
[data-lane=data]{--ln:var(--data)}

/* ------------------------------------------------ rings: a station per kind */
.ring{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid var(--k,var(--ink3));background:var(--surface);flex:0 0 auto}
.ring[data-on="1"]{background:var(--k,var(--ink3))}
.ring[data-k=page]{--k:var(--screen)}
.ring[data-k=endpoint]{--k:var(--api)}
.ring[data-k=module]{--k:var(--module)}
.ring[data-k=table]{--k:var(--data)}
.ring[data-k=call]{--k:var(--bad)}
.ring[data-k=change],.ring[data-k=task]{--k:var(--ink2)}
.ring[data-k=test],.ring[data-k=req],.ring[data-k=file]{--k:var(--ink3);border-width:2px}

/* ------------------------------------------------ list */
.lhead{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:var(--s2);min-height:52px;padding:var(--s2) var(--s4);background:var(--surface);border-bottom:1px solid var(--rule)}
.lhead h2{font:600 var(--fs-m) var(--display)}
.lh{font-size:var(--fs-xs);color:var(--ink3)}
.toggle{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 var(--s3);border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink2);font-size:var(--fs-s);cursor:pointer}
.toggle:hover{border-color:var(--ink3)}
.toggle[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.toggle[aria-pressed=true] .cn{color:inherit}
.grp{position:sticky;top:52px;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);padding:var(--s3) var(--s4) 6px;background:var(--ground);border-bottom:1px solid var(--rule2)}
.grp .gt{font:600 var(--fs-xs) var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.grp .gm{font:var(--fs-xs) var(--ui);color:var(--ink3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
/* A sub-group inside a gap list: not sticky, quieter than the section above it. */
.grp.sub{position:static;padding-top:var(--s2);padding-bottom:4px;background:var(--ground)}
.grp.sub .gt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink3)}
.grp.bad .gt{color:var(--bad)}
details.grpwrap>summary{position:static;cursor:pointer;list-style:none}
details.grpwrap>summary::-webkit-details-marker{display:none}
details.grpwrap>summary.grp .gt::after{content:" +";color:var(--ink3)}
details.grpwrap[open]>summary.grp .gt::after{content:""}
.moresum{display:block;padding:var(--s3) var(--s4);color:var(--link);font-size:var(--fs-s)}

.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;column-gap:var(--s3);row-gap:2px;align-items:baseline;min-height:48px;padding:10px var(--s4);border-bottom:1px solid var(--rule2);color:var(--ink);border-left:3px solid transparent}
.row:hover{background:var(--hover);text-decoration:none}
.row .ring{align-self:center;grid-row:1}
.row[aria-current=true]{background:var(--accent-bg);border-left-color:var(--accent)}
.row[aria-current=true] .ring{background:var(--k,var(--ink3))}
.row[aria-current=true] .rn{font-weight:600}
.rn{grid-column:2;font:500 var(--fs-c)/1.4 var(--ui);overflow-wrap:break-word;min-width:0}
.row.code .rn{font:500 var(--fs-s)/1.45 var(--mono)}
.ep{display:inline-flex;align-items:baseline;gap:.6em;width:100%;min-width:0}
.pth{min-width:0;overflow-wrap:break-word}
/* a method is a small chip, coloured by what it does */
.mt{display:inline-block;flex:0 0 auto;min-width:3.4em;padding:2px 5px;border-radius:4px;background:var(--sunk);font:600 .6875rem/1.2 var(--mono);color:var(--ink3);letter-spacing:.02em;text-align:center}
.mt[data-m=GET],.mt[data-m=QUERY]{background:#e7f5ee;color:#11704f}
.mt[data-m=POST],.mt[data-m=MUTATION]{background:#e9effd;color:#2f4fc4}
.mt[data-m=PUT],.mt[data-m=PATCH]{background:#fdf3e4;color:#94560a}
.mt[data-m=DELETE]{background:#fdecea;color:#b4261a}
:root[data-theme=dark] .mt[data-m=GET],:root[data-theme=dark] .mt[data-m=QUERY]{background:#123326;color:#6fd3a5}
:root[data-theme=dark] .mt[data-m=POST],:root[data-theme=dark] .mt[data-m=MUTATION]{background:#1c2a52;color:#a9bdff}
:root[data-theme=dark] .mt[data-m=PUT],:root[data-theme=dark] .mt[data-m=PATCH]{background:#3a2a12;color:#f0b765}
:root[data-theme=dark] .mt[data-m=DELETE]{background:#3a1a17;color:#f6a597}
.ra{grid-column:3;grid-row:1;font-size:var(--fs-xs);color:var(--ink3);white-space:nowrap}
.ra.num{font:500 var(--fs-xs) var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.rl{grid-column:2/-1;font-size:var(--fs-s);line-height:1.45;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ok{display:inline-flex;align-items:center;gap:3px;color:var(--ok)}
/* proof marks are not the endpoint line: green stays with the line, tests read as ink */
.proved{display:inline-flex;align-items:center;gap:3px;color:var(--ink2)}
.row.chg .bp{grid-column:2/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--s2);margin-top:6px}
.bp .nb,.np .nb{font:500 var(--fs-xs) var(--mono);font-variant-numeric:tabular-nums;color:var(--ink3)}
.row.gone{color:var(--bad)}
.calm{display:flex;gap:var(--s2);align-items:flex-start;margin:0;padding:var(--s3) var(--s4);font-size:var(--fs-s);color:var(--ink2);border-bottom:1px solid var(--rule2)}
.calm .ico{color:var(--ok);margin-top:2px}
.bar{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ------------------------------------------------ refs */
.refs{list-style:none;margin:0;padding:0}
.refs li{margin:0}
.extra{display:none}
.open>ul>li.extra{display:revert}
.ref{display:flex;align-items:baseline;gap:var(--s2);padding:5px 0;color:var(--ink);font-size:var(--fs-c);line-height:1.4;overflow-wrap:anywhere;min-width:0}
.ref .ring{width:10px;height:10px;border-width:2.5px;align-self:center}
.ref.code{font:var(--fs-s)/1.45 var(--mono)}
.ref:hover{color:var(--link)}
.more{margin-top:var(--s1);min-height:32px;padding:0;border:0;background:none;color:var(--link);font-size:var(--fs-s);cursor:pointer}
.more:hover{text-decoration:underline}

/* ------------------------------------------------ overview */
.today{max-width:1180px;padding:var(--s5) var(--s6) var(--s7)}
.hero h1{font:700 var(--fs-2xl)/1.15 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.status{display:flex;align-items:center;gap:var(--s3);margin:var(--s4) 0 0;padding:var(--s3) var(--s4);border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
.status>.ico{width:22px;height:22px;padding:3px;border-radius:50%;stroke-width:2.2}
.status.ok>.ico{color:#fff;background:var(--ok)}
.status.bad{border-color:var(--bad);background:var(--bad-bg)}
.status.bad>.ico{color:#fff;background:var(--bad)}
.status p{display:grid;gap:1px;margin:0;flex:1 1 auto;font-size:var(--fs-s);color:var(--ink2)}
.status b{font-size:var(--fs-m);color:var(--ink)}
.status.bad b{color:var(--bad)}
.btn{display:inline-flex;align-items:center;min-height:34px;padding:0 var(--s3);border-radius:var(--r);background:var(--bad);color:#fff;font:600 var(--fs-s) var(--ui);white-space:nowrap}
.btn:hover{text-decoration:none;filter:brightness(1.08)}
/* the four lines as cards, the verb that joins them between */
.stats{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:var(--s2);margin:var(--s5) 0 0}
.flow{align-self:center}
.stat{position:relative;display:flex;flex-direction:column;gap:4px;padding:var(--s4);border:1px solid var(--rule);border-top:3px solid var(--ln);border-radius:var(--r);background:var(--surface);color:var(--ink2);box-shadow:var(--shadow);min-width:0}
.stat:hover{text-decoration:none;border-color:var(--ln)}
.sl{display:flex;align-items:center;gap:7px;font:600 var(--fs-s) var(--ui);color:var(--ink2)}
.sl .dot{width:9px;height:9px;border-radius:50%;background:var(--ln)}
.stat b{font:700 1.875rem/1.1 var(--display);letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.ss{font-size:var(--fs-xs);color:var(--ink3)}
.stat .bar{margin-top:4px;height:4px}
.stat .bar i{background:var(--ln)}
.flow{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 .6875rem var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s5);align-items:start;margin-top:var(--s5)}
.work{display:grid;gap:var(--s5);min-width:0}
.card{padding:var(--s4) var(--s5) var(--s5);border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.card h2,.intro h2{font:600 var(--fs-m)/1.3 var(--display);margin:0 0 var(--s2)}
.line{margin:0 0 var(--s2);font-size:var(--fs-c);color:var(--ink2);max-width:72ch}
.line.brief{margin:0;color:var(--ink3);font-size:var(--fs-s)}
.next{list-style:none;margin:var(--s2) calc(-1*var(--s3)) 0;padding:0}
.next li+li{border-top:1px solid var(--rule2)}
.next a{display:grid;grid-template-columns:28px minmax(0,1fr) 116px;gap:var(--s3);align-items:center;min-height:56px;padding:var(--s3);border-radius:6px;color:var(--ink)}
.next a:hover{background:var(--hover);text-decoration:none}
.nn{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:600 var(--fs-xs) var(--mono)}
.next .bad .nn{background:var(--bad)}
.next .parked .nn{background:transparent;color:var(--ink3);border:2px solid var(--rule)}
.nt{display:grid;gap:2px;min-width:0}
.nt b{font-weight:600;overflow-wrap:anywhere}
.next .bad .nt b{color:var(--bad)}
.nk{color:var(--ink2);font-size:var(--fs-c);overflow-wrap:anywhere}
.ns{color:var(--ink3);font-size:var(--fs-s)}
.tid{display:inline-block;min-width:3em;margin-right:6px;font:600 var(--fs-xs) var(--mono);color:var(--ink3)}
.np{display:grid;gap:5px}
.np .bar{width:100%}
.np .nb{text-align:right}
.morelinks{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin:var(--s3) 0 0;font-size:var(--fs-s)}
.morelinks a{display:inline-flex;align-items:center;gap:4px;min-height:32px}
.delta{list-style:none;margin:var(--s2) 0 0;padding:0;border-top:1px solid var(--rule)}
.delta li{display:grid;grid-template-columns:80px minmax(0,1fr);gap:2px var(--s3);align-items:baseline;padding:var(--s2) 0;border-bottom:1px solid var(--rule2)}
.delta li.extra{display:none}
.open>.delta>li.extra{display:grid}
.dk{font-size:var(--fs-s);color:var(--ink3)}
.dn{display:flex;align-items:baseline;gap:var(--s2);font:var(--fs-s)/1.45 var(--mono);overflow-wrap:anywhere;min-width:0}

};

function repoName(){return S.name||String(S.root).replace(/\\/g,'/').split('/').filter(Boolean).pop()||S.root}
function load(i){
  S=D.projects[i];sel=null;q='';untestedOnly=false;$('#q').value='';
  ix=new Map();out=new Map();inn=new Map();
  for(const n of S.nodes)ix.set(n.i,n);
  for(const e of S.edges){
    const a=e[0],b=e[1],k=e[2];
    if(!out.has(a))out.set(a,[]);
    if(!inn.has(b))inn.set(b,[]);
    out.get(a).push([b,k]);inn.get(b).push([a,k]);
  }
  const proj=$('#proj');
  if(D.projects.length>1){
    proj.hidden=false;
    proj.innerHTML=D.projects.map((p,n)=>'<option value="'+n+'"'+(n===i?' selected':'')+'>'+esc(p.name)+'</option>').join('');
  } else proj.hidden=true;
  document.title='weave — '+repoName();
  place='today';readHash();render();
}
// Old links keep working: #now, #summary, #screens, #api, #data, #problems.
const LEGACY={now:'today',summary:'today',screens:'map/screens',api:'map/endpoints',data:'map/tables',problems:'checks'};
function readHash(){
  const h=location.hash||'';
  if(h.indexOf('#node/')===0){
    let id='';
    try{id=decodeURIComponent(h.slice(6))}catch(e){id=''}
    if(ix.has(id)){sel=id;placeFor(id);return}
  }
  let v=h.charAt(0)==='#'?h.slice(1):'';
  if(v==='search'){sel=null;return}
  if(LEGACY[v])v=LEGACY[v];
  const parts=v.split('/');
  if(parts[0]==='map'){place='map';const l=laneBy(parts[1]||'');if(l)lane=l.key;sel=null;return}
  for(const p of PLACES)if(p[0]===parts[0]){place=p[0];sel=null;return}
  if(!v){place='today';sel=null}
}
function placeFor(id){
  if(q)return;
  const k=kindOf(id),l=laneBy(k);
  if(l){place='map';lane=l.key;return}
  if(k==='change'||k==='task'||k==='req'){place='changes';return}
  if(k==='call'){place='checks';return}
}

/* ---------------------------------------------------------------- chrome */
function render(){
  const solo=place==='today'&&!q;
  const main=$('#main');
  main.classList.toggle('solo',solo);
  main.classList.toggle('has-sel',!!sel&&!solo);
  renderTabs();
  renderCrumbs();
  if(solo)$('#list').innerHTML='';else renderList();
  renderDetail();
  if(!fromList&&!narrow()){const cur=$('#list [aria-current="true"]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'center'})}
  fromList=false;
  if(focusSel){
    focusSel=false;
    const target=narrow()?$('#detail h1'):$('#list [data-go][aria-current="true"]');
    if(target)target.focus();
  }
}
// The sidebar: Overview, the four lines of the map with their counts, then the work.
// The hosted panel appends Specs and Wiki after the last link.
function renderTabs(){
  const broken=brokenCount(),open=S.changes.filter(c=>c.done<c.total).length,gaps=gapCount(),c=S.counts;
  const n={screens:c.pages,endpoints:c.endpoints,modules:c.modules,tables:c.tables};
  const cur=(p,l)=>!q&&place===p&&(!l||lane===l)?' aria-current="page"':'';

  h+='<p class="navh" aria-hidden="true">Map</p>';

  h+='<p class="navh" aria-hidden="true">Work</p>';
  h+='<a href="#checks"'+cur('checks')+'>'+ICON.shield+'<span class="tl">Checks</span>'+(broken?'<span class="tc bad" title="'+cnt(broken,'broken call')+'">'+broken+'</span>':gaps?'<span class="tc" title="'+cnt(gaps,'gap')+' in proof">'+gaps+'</span>':'')+'</a>';
  h+='<a href="#changes"'+cur('changes')+'>'+ICON.list+'<span class="tl">Changes</span>'+(open?'<span class="tc" title="'+open+' in progress">'+open+'</span>':'')+'</a>';
  $('#tabs').innerHTML=h;
}
function renderCrumbs(){
  const c=[['#today',repoName()]];
  if(q)c.push(['#search','Search “'+q+'”']);
  else if(place==='today'){c.push([null,'Overview'])}
  else if(place==='map'){c.push(['#map/'+lane,'Map']);c.push(['#map/'+lane,laneBy(lane).name])}
  else if(place==='changes')c.push(['#changes','Changes']);
  else if(place==='checks')c.push(['#checks','Checks']);
  if(sel&&ix.has(sel)){
    const n=ix.get(sel);
    if(n.k==='change')c.push([null,changeTitle(n.i).title]);
    else c.push([null,n.n]);
  }
  // The last link is the way back; the last crumb is where you are.
  const items=c.map((x,i)=>{
    const last=i===c.length-1;
    if(last||!x[0])return '<li><span'+(last?' aria-current="page"':'')+'>'+esc(x[1])+'</span></li>';
    return '<li'+(i===c.length-2?' class="up"':'')+'><a href="'+x[0]+'">'+(i===c.length-2?'<span class="upico">'+ICON.back+'</span>':'')+esc(x[1])+'</a>'+ICON.chev+'</li>';
  });
  const d=new Date(S.builtAt);
  const stamp=isNaN(d)?'':'Indexed '+d.toLocaleDateString('en',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('#crumbs').innerHTML='<ol>'+items.join('')+'</ol>'+(stamp?'<span class="stamp">'+esc(stamp)+'</span>':'');
}

/* ---------------------------------------------------------------- facts */
function relOut(id,kind){const r=[];for(const e of out.get(id)||[])if((!kind||e[1]===kind)&&ix.has(e[0])&&r.indexOf(e[0])<0)r.push(e[0]);return r}
function relIn(id,kind){const r=[];for(const e of inn.get(id)||[])if((!kind||e[1]===kind)&&ix.has(e[0])&&r.indexOf(e[0])<0)r.push(e[0]);return r}
function isTested(id){return (inn.get(id)||[]).some(e=>e[1]==='hits'||e[1]==='covers')}
function hasE2e(id){return (inn.get(id)||[]).some(e=>e[1]==='exercises')}
function issue(key){for(const g of S.issues)if(g.key===key)return g.items;return []}
function stillCalled(){return S.delta?S.delta.removed.filter(x=>x.k==='endpoint'&&x.c):[]}
function brokenCount(){return issue('broken_calls').length+stillCalled().length}
function testedCount(kind,a,b){
  let n=0;
  for(const node of S.nodes){
    if(node.k!==kind)continue;
    if((inn.get(node.i)||[]).some(e=>e[1]===a||(b&&e[1]===b)))n++;
  }
  return n;
}
function descOf(n){
  if(!n)return '';
  let d=n.d||n.t||'';
  if(n.k==='endpoint')d=d.replace(/^[A-Z]+ \S+ [—-] /,'');
  return plain(d);
}
function plain(s){return String(s==null?'':s).replace(/\*\*/g,'').replace(/[`]/g,'').replace(/\s+/g,' ').trim()}
function splitEp(n){const i=n.indexOf(' ');return i<0?['',n]:[n.slice(0,i),n.slice(i+1)]}
function epSort(a,b){const A=splitEp(a.n),B=splitEp(b.n);return A[1].localeCompare(B[1])||A[0].localeCompare(B[0])}
function changeTitle(id){
  const slug=String(id).replace(/^change:/,'');
  const m=slug.match(/^(\d{4}-\d{2}-\d{2})-(.*)$/);
  return {title:m?m[2]:slug,date:m?m[1]:''};
}
// Task titles carry their evidence clause; a worklist wants the instruction.
function taskTitle(t){const s=plain(t);const i=s.indexOf(' Evidence:');return i<0?s:s.slice(0,i)}
function taskParts(t){const s=taskTitle(t),m=s.match(/^(T[\w.]*)\s+([\s\S]*)$/);return m?[m[1],m[2]]:['',s]}
// "Later: …", "Not done, by choice: …" and [deferred] are parked work, not the next step.
function isLater(t){return /^(T[\w.]*\s+)?(\[?(later|deferred)\b|not done\b)/i.test(taskTitle(t))}
// The task's id is the last word of its node name; the title itself has it stripped.
function taskIdOf(t){const s=plain(t&&t.n||'');const i=s.lastIndexOf(' ');return i<0?s:s.slice(i+1)}
function tasksOf(changeId){
  const r=[];
  for(const e of out.get(changeId)||[])if(e[1]==='has_task'){const t=ix.get(e[0]);if(t)r.push(t)}
  return r;
}
function nextTask(c){
  const open=tasksOf(c.c).filter(t=>!t.dn);
  const live=open.filter(t=>!isLater(t.t||t.n));
  if(live.length)return {t:live[0],deferred:false,live:live.length,later:open.length-live.length};
  const firstOpen=c.open.filter(t=>!isLater(t))[0];
  if(firstOpen)return {t:{t:firstOpen,n:''},deferred:false,live:c.total-c.done,later:0};
  return open.length?{t:open[0],deferred:true,live:0,later:open.length}:null;
}

/* ---------------------------------------------------------------- shared markup */
function ring(k,on){return '<span class="ring" data-k="'+esc(k)+'"'+(on?' data-on="1"':'')+' aria-hidden="true"></span>'}
function nm(id){
  const n=ix.get(id),k=kindOf(id);
  if(k==='endpoint'){const p=splitEp(n.n);return '<span class="ep"><span class="mt" data-m="'+esc(p[0])+'">'+esc(p[0])+'</span><span class="pth">'+brk(p[1])+'</span></span>'}
  if(k==='change')return esc(changeTitle(id).title);
  if(k==='page'||k==='file'||k==='call')return brk(nameOf(id));
  if(k==='task'&&n.t)return esc(taskTitle(n.t));
  if(k==='req'&&n.t)return '<span class="mt">'+esc(n.n)+'</span> '+esc(plain(n.t));
  return esc(nameOf(id));
}
// A path breaks after / . - and _, never inside a word.
function brk(s){return esc(s).replace(/([\/.\-_])/g,'$1<wbr>')}
function ref(id){
  const k=kindOf(id);
  return '<a class="ref'+(LANE_OF[k]||k==='call'||k==='file'||k==='test'?' code':'')+'" data-go="'+esc(id)+'" href="'+enc(id)+'">'+ring(k)+'<span>'+nm(id)+'</span></a>';
}
function refList(ids,limit){
  const cap=limit||SHOW;
  let h='<ul class="refs">'+ids.map((id,i)=>'<li'+(i>=cap?' class="extra"':'')+'>'+ref(id)+'</li>').join('')+'</ul>';
  if(ids.length>cap)h+=moreBtn(ids.length);
  return h;
}
function moreBtn(n){return '<button class="more" type="button" data-more aria-expanded="false" data-n="'+n+'">Show all '+n+'</button>'}
function row(id,aside,lines){
  const k=kindOf(id);
  return '<a class="row'+(LANE_OF[k]||k==='call'||k==='test'||k==='file'?' code':'')+'" data-go="'+esc(id)+'" href="'+enc(id)+'">'+ring(k)+
    '<span class="rn">'+nm(id)+'</span>'+(aside?'<span class="ra">'+aside+'</span>':'')+
    (lines||[]).filter(Boolean).map(l=>'<span class="rl">'+l+'</span>').join('')+'</a>';
}
function grp(title,meta,cls){return '<div class="grp'+(cls?' '+cls:'')+'"><span class="gt">'+esc(title)+'</span><span class="gm" title="'+esc(meta)+'">'+esc(meta)+'</span></div>'}
function empty(t,p){return '<div class="empty"><p class="et">'+esc(t)+'</p><p>'+p+'</p></div>'}
function bar(done,total,label){
  const pct=Math.round(done/Math.max(1,total)*100);
  return '<span class="bar" role="img" aria-label="'+esc(label||done+' of '+total)+'"><i style="width:'+pct+'%"></i></span>';
}
/* ---------------------------------------------------------------- lists */
function renderList(){
  const live=$('#live');
  if(live&&!q)live.textContent='';
  // Keep the scroll only while the same list is on screen.
  const key=q?'q:'+q:place+'/'+lane+'/'+untestedOnly;
  const box=$('#list'),keep=key===listKey?box.scrollTop:0;
  listKey=key;
  let h='';
  if(q)h=findList();
  else if(place==='map')h=laneList();
  else if(place==='changes')h=changesList();
  else if(place==='checks')h=checksList();
  box.innerHTML=h;
  box.scrollTop=keep;
  for(const a of box.querySelectorAll('[data-go]')){
    if(a.dataset.go===sel)a.setAttribute('aria-current','true');
    else a.removeAttribute('aria-current');
  }
}
function lhead(title,n,extra){return '<div class="lhead"><h2>'+esc(title)+' <span class="cn">'+n+'</span></h2>'+(extra||'')+'</div>'}
function nodeMatch(n){return matches(n.n)||matches(n.f)||matches(n.d)||matches(n.t)}
function laneList(){
  if(lane==='endpoints')return apiList();
  const L=laneBy(lane);
  const rows=S.nodes.filter(n=>n.k===L.k);
  if(!rows.length)return lhead(L.name,0)+empty('No '+L.name.toLowerCase()+' found',laneEmpty(L.key));
  if(lane==='screens'){
    const flow=new Map();for(const f of S.flows)flow.set(f.p,f);
    const calls=n=>{const f=flow.get(n.i);return f?f.e.length:0};
    rows.sort((a,b)=>calls(b)-calls(a)||a.n.localeCompare(b.n));
    return lhead('Screens',rows.length,'<span class="lh">most connected first</span>')+rows.map(n=>{
      const f=flow.get(n.i),e=f?f.e.length:0,t=f?f.t.length:0;
      const meta=(e?cnt(e,'endpoint'):'calls no endpoint')+(t?' · '+cnt(t,'table'):'');
      return row(n.i,hasE2e(n.i)?'<span class="proved">'+ICON.check+'e2e</span>':'',[descOf(n)?esc(descOf(n)):'',esc(meta)]);
    }).join('');
  }
  if(lane==='modules'){
    const mod=new Map();for(const m of S.modules)mod.set(m.m,m);
    rows.sort((a,b)=>a.n.localeCompare(b.n));
    return lhead('Modules',rows.length,'<span class="lh">by name</span>')+rows.map(n=>{
      const m=mod.get(n.i),e=m?m.e.length:0,t=m?m.t.length:0;
      return row(n.i,'',[esc((e?cnt(e,'endpoint'):'no endpoints')+(t?' · uses '+cnt(t,'table'):''))]);
    }).join('');
  }
  rows.sort((a,b)=>a.n.localeCompare(b.n));
  return lhead('Tables',rows.length,'<span class="lh">by name</span>')+rows.map(n=>{
    const mods=relIn(n.i,'uses').map(nameOf);
    return row(n.i,'',[n.d?esc(plain(n.d)):'',esc(mods.length?'used by '+mods.slice(0,3).join(', ')+(mods.length>3?' +'+(mods.length-3):''):'no module uses it')]);
  }).join('');
}
function laneEmpty(k){
  return {screens:'Screens are the routes weave finds in React Router or Next.js.',endpoints:'weave reads Express, Next.js route handlers, tRPC routers and OpenAPI specs.',
    modules:'A module is the backend folder that handles endpoints.',tables:'Tables come from Prisma models.'}[k]+' Run <code>weave doctor</code> to see the files it could not parse.';
}
function apiList(){
  const all=S.nodes.filter(n=>n.k==='endpoint');
  const untested=all.filter(n=>!isTested(n.i)).length;
  const filter='<button class="toggle" type="button" id="untested" aria-pressed="'+untestedOnly+'">Untested only <span class="cn">'+untested+'</span></button>';
  const keep=n=>!untestedOnly||!isTested(n.i);
  const eps=all.filter(keep);
  let h=lhead('Endpoints',eps.length,filter);
  if(!all.length)return h+empty('No endpoints found',laneEmpty('endpoints'));
  if(!eps.length)return h+empty('Every endpoint has a test','Turn the filter off to see them all.');
  const owned=new Set(),groups=[];
  for(const m of S.modules){
    const bag=m.e.map(id=>ix.get(id)).filter(Boolean).filter(keep);
    for(const id of m.e)owned.add(id);
    if(bag.length)groups.push({m,eps:bag.sort(epSort)});
  }
  groups.sort((a,b)=>nameOf(a.m.m).localeCompare(nameOf(b.m.m)));
  const loose=eps.filter(n=>!owned.has(n.i)).sort(epSort);
  const apiRow=n=>row(n.i,isTested(n.i)?'<span class="proved">'+ICON.check+'tested</span>':'',[descOf(n)?esc(descOf(n)):'']);
  for(const g of groups){
    const used=g.m.t.map(nameOf);
    h+=grp(nameOf(g.m.m),cnt(g.eps.length,'endpoint')+(used.length?' · uses '+used.slice(0,2).join(', ')+(used.length>2?' +'+(used.length-2):''):''));
    h+=g.eps.map(apiRow).join('');
  }
  if(loose.length)h+=grp('No module',cnt(loose.length,'endpoint'))+loose.map(apiRow).join('');
  return h;
}
function changesList(){
  const open=S.changes.filter(c=>c.done<c.total),done=S.changes.filter(c=>c.done>=c.total);
  if(!S.changes.length)return lhead('Changes',0)+empty('No change records','A change record is a <code>tasks.md</code> with checkbox tasks; weave links each task to the files its Evidence line names.');
  let h=lhead('Changes',S.changes.length,'<span class="lh">newest first</span>');
  if(open.length)h+=grp('In progress',cnt(open.length,'change'))+open.map(changeRow).join('');
  if(done.length)h+='<details class="grpwrap"'+(open.length?'':' open')+'><summary class="grp"><span class="gt">Done</span><span class="gm">'+cnt(done.length,'change')+'</span></summary>'+done.map(changeRow).join('')+'</details>';
  return h;
}
function changeRow(c){
  const t=changeTitle(c.c),left=c.total-c.done;
  return '<a class="row chg" data-go="'+esc(c.c)+'" href="'+enc(c.c)+'">'+ring('change',c.done>=c.total)+
    '<span class="rn">'+esc(t.title)+'</span>'+
    '<span class="rl">'+esc(t.date)+(left?' · '+left+' open':' · done')+'</span>'+
    '<span class="bp">'+bar(c.done,c.total,c.done+' of '+c.total+' tasks done')+'<span class="nb">'+c.done+'/'+c.total+'</span></span></a>';
}
function checksList(){
  const broken=issue('broken_calls'),gone=stillCalled();
  const nb=broken.length+gone.length,gapsN=gapCount();
  // The badge is the gate: broken items only. Gaps are named in the aside, where a
  // reader can see they are proof that is missing, not work that is failing. The
  // heading counts everything the place lists, or it contradicts the rows below it.
  let h=lhead('Checks',nb+gapsN,'<span class="lh">'+nb+' broken · '+gapsN+' gaps in proof</span>');
  h+=grp('Broken',nb?cnt(nb,'item'):'nothing',nb?'bad':'');
  if(!nb)h+='<p class="calm">'+ICON.check+'<span>Nothing <code>weave check</code> would fail: every frontend call matches an endpoint.</span></p>';
  h+=broken.map(id=>row(id,'',['matches no endpoint · '+esc(where(id))])).join('');
  h+=gone.map(x=>'<div class="row gone">'+ring('endpoint')+'<span class="rn"><s>'+esc(x.n)+'</s></span><span class="rl">removed since '+esc(S.delta.ref)+', still called by '+cnt(x.c,'file')+'</span></div>').join('');

  // Untested endpoints are the bulk of the list, so they get the grouping and the
  // ranking the Endpoints lane already has: by module, then by how many screens call.
  const unt=issue('untested_endpoints');
  const callers=id=>relIn(id,'calls').filter(x=>kindOf(x)==='page').length;
  if(unt.length){
    const untSet=new Set(unt),owned=new Set(),groups=[];
    for(const m of S.modules){
      const ids=m.e.filter(id=>untSet.has(id));
      for(const id of ids)owned.add(id);
      if(ids.length)groups.push({m,ids});
    }
    groups.sort((a,b)=>b.ids.length-a.ids.length);
    const loose=unt.filter(id=>!owned.has(id));
    const gapRow=id=>row(id,callers(id)?cnt(callers(id),'screen'):'no screen calls it',[]);
    h+=grp('Endpoints with no direct test',String(unt.length),'gap');
    for(const g of groups){
      h+=grp(nameOf(g.m.m),cnt(g.ids.length,'endpoint'),'gap sub');
      h+=g.ids.sort((a,b)=>callers(b)-callers(a)||nameOf(a).localeCompare(nameOf(b))).map(gapRow).join('');
    }
    if(loose.length)h+=grp('No module',cnt(loose.length,'endpoint'),'gap sub')+loose.sort((a,b)=>callers(b)-callers(a)).map(gapRow).join('');
  }
  const rest=[['pages_without_e2e','Screens with no end-to-end test'],['suspect_reqs','Requirements changed after their code']];
  for(const g of rest){
    const items=issue(g[0]);
    if(!items.length)continue;
    h+=grp(g[1],String(items.length),'gap');
    h+=items.map(id=>row(id,'',[])).join('');
  }
  if(!gapsN)h+='<p class="calm">'+ICON.check+'<span>No gaps in proof: every endpoint and screen has a test.</span></p>';
  return h;
}
function where(id){const n=ix.get(id);return n&&n.f?n.f+(n.l?':'+n.l:''):''}
function gapCount(){return issue('untested_endpoints').length+issue('pages_without_e2e').length+issue('suspect_reqs').length}

/* ---------------------------------------------------------------- today */
function today(){
  const broken=issue('broken_calls'),gone=stillCalled(),open=S.changes.filter(c=>c.done<c.total);
  const nb=broken.length+gone.length;
  let h='<div class="today"><header class="hero"><h1 tabindex="-1">'+esc(repoName())+'</h1>';
  h+=nb
    ?'<div class="status bad">'+ICON.cross+'<p><b>'+cnt(nb,'broken contract')+'</b><span>A frontend call no longer matches an endpoint. <code>weave check</code> fails until '+(nb===1?'it is':'they are')+' fixed.</span></p><a class="btn" href="#checks">See what broke</a></div>'
    :'<div class="status ok">'+ICON.check+'<p><b>The contract gate passes</b><span>Every frontend call matches an endpoint.</span></p></div>';
  h+='</header><div id="reviewslot"></div>'+statCards();
  h+='<div class="cols"><div class="work">';

// The four lines as cards, in the order a request travels, with the proof under each.
function statCards(){
  const c=S.counts,te=testedCount('endpoint','hits','covers'),tp=testedCount('page','exercises');
  const usedTables=S.nodes.filter(n=>n.k==='table'&&relIn(n.i,'uses').length).length;
  const busyMods=S.modules.filter(m=>m.e.length).length;
  const cards=[
    ['screens','screen',c.pages,'Screens',tp+' of '+c.pages+' with an end-to-end test',tp,c.pages],
    ['endpoints','api',c.endpoints,'Endpoints',te+' of '+c.endpoints+' with a direct test',te,c.endpoints],
    ['modules','module',c.modules,'Modules',busyMods+' handle endpoints',null,0],
    ['tables','data',c.tables,'Tables',usedTables+' used by a module',null,0]
  ];
  return '<nav class="stats" aria-label="The map">'+cards.map((x,i)=>
    '<a class="stat" data-lane="'+x[1]+'" href="#map/'+x[0]+'"><span class="sl"><span class="dot" aria-hidden="true"></span>'+x[3]+'</span><b>'+x[2]+'</b><span class="ss">'+esc(x[4])+'</span>'+(x[5]!=null?bar(x[5],x[6],x[4]):'')+'</a>'+
    (i<3?'<span class="flow" aria-hidden="true">'+esc(LANES[i].verb)+ICON.next+'</span>':'')).join('')+'</nav>';

// No news is one quiet line after the work, not a heading that pushes it down.
function quietDelta(){
  const d=S.delta;
  if(!d)return '';
  if(d.added.length+d.removed.length+d.moved.length)return '';
  return '<p class="line brief">No change on the map since <code>'+esc(d.ref)+'</code>.</p>';
}
function sinceBlock(){
  const d=S.delta;
  if(!d)return '<section class="card"><h2>Since the last commit</h2><p class="line">No baseline: this repo has no git history weave could read, or the page was written with <code>--no-delta</code>.</p></section>';
  const total=d.added.length+d.removed.length+d.moved.length;
  if(!total)return '';
  let h='<section class="card"><h2>Since the last commit</h2>';
  // What changed, counted by kind, then the few rows that explain it.
  const kindWord=(list,verb)=>{
    const by=new Map();
    for(const x of list){const k=KINDS[x.k]||x.k;by.set(k,(by.get(k)||0)+1)}
    return [...by].map(([k,v])=>v+' '+k.toLowerCase()+(v===1?'':'s')+' '+verb).join(', ');
  };
  h+='<p class="line">'+[kindWord(d.added,'added'),kindWord(d.moved,'moved'),kindWord(d.removed,d.removed.some(x=>x.c)?'removed or archived':'removed')].filter(Boolean).join(' · ')+' since <code>'+esc(d.ref)+'</code>.</p><ul class="delta">';
  const nameOfDelta=x=>x.k==='change'?changeTitle(x.i).title:x.n;
  const deltaRow=(tag,x,cls)=>'<li'+(cls?' class="'+cls+'"':'')+'><span class="dk">'+tag+'</span><span class="dn'+(x.k==='change'?' sans':'')+'">'+ring(x.k)+esc(nameOfDelta(x))+(x.c?' <b>still called by '+cnt(x.c,'file')+'</b>':'')+'</span></li>';
  const items=[];
  for(const x of d.removed)if(x.c)items.push(deltaRow('Removed',x,'bad'));
  for(const x of d.added)items.push(ix.has(x.i)?'<li><span class="dk">Added</span>'+ref(x.i)+'</li>':deltaRow('Added',x));
  for(const x of d.moved)items.push((ix.has(x.i)?'<li><span class="dk">Moved</span>'+ref(x.i):deltaRow('Moved',x)).replace('</li>','<span class="df">'+esc(x.f||'')+'</span></li>'));
  for(const x of d.removed)if(!x.c)items.push(deltaRow('Removed',x));
  h+=items.map((x,i)=>i<4?x:x.replace('<li class="','<li class="extra ').replace('<li>','<li class="extra">')).join('')+'</ul>';
  if(items.length>4)h+=moreBtn(items.length);
  return h+'</section>';
}
// What to do next, in the order the gate would take it.
function worklist(broken,gone,open){
  const items=[];
  for(const id of broken.slice(0,3))items.push({bad:true,href:enc(id),title:'Fix the call to '+nameOf(id),sub:'it matches no endpoint · '+where(id)});
  for(const x of gone.slice(0,3))items.push({bad:true,href:'#checks',title:'Restore '+x.n+' or update its callers',sub:'removed since '+S.delta.ref+', still called by '+cnt(x.c,'file')});
  const parked=[];
  for(const c of open){
    const nt=nextTask(c);
    const t=changeTitle(c.c);
    if(!nt)continue;
    const p=taskParts(nt.t.t||nt.t.n);
    const it={href:enc(c.c),title:t.title,task:p,sub:t.date+' · '+c.done+' of '+c.total+' done',c};
    if(nt.deferred){it.sub+=' · only deferred tasks left';it.parked=true;parked.push(it)}else items.push(it);
  }
  const gaps=issue('untested_endpoints').map(id=>({id,n:relIn(id,'calls').filter(x=>kindOf(x)==='page').length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,2);
  for(const g of gaps)items.push({href:enc(g.id),title:'Add a test for '+nameOf(g.id),sub:'called from '+cnt(g.n,'screen')+', no direct test'});
  const noe2e=issue('pages_without_e2e').length;
  if(noe2e)items.push({href:'#checks',title:cnt(noe2e,'screen')+' without an end-to-end test',sub:'see them under Checks'});
  for(const p of parked)items.push(p);
  if(!items.length)return '<p class="line">Nothing is waiting: no broken call, no open task, no gap in proof.</p>';
  const cap=7;
  let h='<ol class="next">'+items.slice(0,cap).map((it,i)=>
    '<li class="'+(it.bad?'bad':'')+(it.parked?'parked':'')+'"><a href="'+it.href+'"><span class="nn" aria-hidden="true">'+(i+1)+'</span>'+
    '<span class="nt"><b>'+esc(it.title)+'</b>'+(it.task?'<span class="nk">'+(it.task[0]?'<span class="tid">'+esc(it.task[0])+'</span>':'')+esc(it.task[1])+'</span>':'')+
    '<span class="ns">'+esc(it.sub)+'</span></span>'+(it.c?'<span class="np">'+bar(it.c.done,it.c.total,it.c.done+' of '+it.c.total+' tasks done')+'<span class="nb">'+it.c.done+'/'+it.c.total+'</span></span>':'')+'</a></li>').join('')+'</ol>';
  const more=[];
  if(open.length>0)more.push('<a href="#changes">'+cnt(open.length,'change')+' in progress'+ICON.next+'</a>');
  if(gapCount())more.push('<a href="#checks">All gaps in proof'+ICON.next+'</a>');
  if(more.length)h+='<p class="morelinks">'+more.join('')+'</p>';
  return h;
}

/* ---------------------------------------------------------------- the line */
function chain(id){
  const k=kindOf(id),L={screen:[],api:[],module:[],data:[]};
  const add=(l,ids)=>{for(const x of ids)if(ix.has(x)&&L[l].indexOf(x)<0)L[l].push(x)};
  if(LANE_OF[k])add(LANE_OF[k],[id]);
  const modsOf=eps=>{const r=[];for(const e of eps)for(const m of relOut(e,'in_module'))if(r.indexOf(m)<0)r.push(m);return r};
  const epsOfMods=mods=>{const r=[];for(const m of mods)for(const e of relIn(m,'in_module'))if(r.indexOf(e)<0)r.push(e);return r};
  const tablesOf=mods=>{const r=[];for(const m of mods)for(const t of relOut(m,'uses'))if(r.indexOf(t)<0)r.push(t);return r};
  const screensOf=eps=>{const r=[];for(const e of eps)for(const p of relIn(e,'calls'))if(kindOf(p)==='page'&&r.indexOf(p)<0)r.push(p);return r};
  if(k==='page'){const eps=relOut(id,'calls');add('api',eps);const mods=modsOf(eps);add('module',mods);add('data',tablesOf(mods))}
  else if(k==='endpoint'){const mods=relOut(id,'in_module');add('module',mods);add('data',tablesOf(mods));add('screen',screensOf([id]))}
  else if(k==='module'){const eps=epsOfMods([id]);add('api',eps);add('data',tablesOf([id]));add('screen',screensOf(eps))}
  else if(k==='table'){const mods=relIn(id,'uses');add('module',mods);const eps=epsOfMods(mods);add('api',eps);add('screen',screensOf(eps))}
  return L;
}
// How each station relates to the item you are on, in words.
function stationLabel(k,l,n){
  const one={screen:'screen',api:'endpoint',module:'module',data:'table'}[l];
  const N=cnt(n,one);
  const W={
    page:{api:'Calls '+N,module:'Handled in '+N,data:'Reaches '+N},
    endpoint:{screen:'Called from '+N,module:n===1?'Handled in':'Handled in '+N,data:'Its module uses '+N},
    module:{screen:'Called from '+N,api:'Handles '+N,data:'Uses '+N},
    table:{screen:'Reached from '+N,api:'Reached by '+N,module:'Used by '+N}
  };
  return (W[k]&&W[k][l])||N;
}
function diagram(id){

function conn(id){
  const r=[];
  for(const e of out.get(id)||[])if(ix.has(e[0]))r.push({id:e[0],k:kindOf(e[0]),edge:e[1],dir:'out'});
  for(const e of inn.get(id)||[])if(ix.has(e[0]))r.push({id:e[0],k:kindOf(e[0]),edge:e[1],dir:'in'});
  return r;
}
function nodeSections(n){
  const all=conn(n.i);
  const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
  const tests=uniq(all.filter(x=>x.k==='test').map(x=>x.id));
  const planned=uniq(all.filter(x=>x.k==='change'||x.k==='task'||x.k==='req').map(x=>x.id));
  const other=all.filter(x=>!LANE_OF[x.k]&&x.k!=='test'&&x.k!=='change'&&x.k!=='task'&&x.k!=='req'&&x.k!=='file');
  let h='<section class="sec"><h2>Proved by'+(tests.length?' <span class="cn">'+tests.length+'</span>':'')+'</h2>'+
    (tests.length?refList(tests):'<p class="line">No test reaches this directly.</p>')+'</section>';
  if(planned.length)h+='<section class="sec"><h2>Planned in <span class="cn">'+planned.length+'</span></h2>'+refList(planned)+'</section>';
  if(other.length)h+=groupsHTML(other);
  h+='<section class="sec"><h2>Reach</h2><p class="line">'+esc(reach(n.i))+'</p></section>';
  return h;
}
function block(title,ids){return '<section class="sec"><h2>'+esc(title)+' <span class="cn">'+ids.length+'</span></h2>'+refList(ids)+'</section>'}
function allRelations(n){
  const all=conn(n.i);
  if(!all.length)return '<section class="sec"><h2>Connections</h2><p class="line">Nothing points at this yet.</p></section>';
  return groupsHTML(all);
}
function groupsHTML(all){
  const map=new Map();
  for(const x of all){
    const say=(SAY[x.edge]||[x.edge,x.edge])[x.dir==='out'?0:1];
    if(!map.has(say))map.set(say,[]);
    if(map.get(say).indexOf(x.id)<0)map.get(say).push(x.id);
  }
  let h='';
  for(const [say,ids] of map)h+=block(say,ids);
  return h;
}
function reach(id){
  const L=chain(id),k=kindOf(id),parts=[],tests=new Set();
  for(const x of conn(id))if(x.k==='test')tests.add(x.id);
  for(const e of L.api)for(const x of conn(e))if(x.k==='test')tests.add(x.id);
  if(k!=='page'&&L.screen.length)parts.push(cnt(L.screen.length,'screen'));
  if(k!=='endpoint'&&L.api.length)parts.push(cnt(L.api.length,'endpoint'));
  if(k!=='table'&&L.data.length)parts.push(cnt(L.data.length,'table'));
  if(tests.size)parts.push(cnt(tests.size,'test'));
  return parts.length?'A change here can reach '+parts.join(', ')+'.':'Nothing else points at this yet.';
}

/* ---------------------------------------------------------------- find */
function findIds(){return [...ix.keys()].filter(id=>nodeMatch(ix.get(id)))}
function findList(){
  const ids=findIds();
  const live=$('#live');
  if(live)live.textContent=ids.length+(ids.length===1?' match':' matches')+' for '+q;
  if(!ids.length)return lhead('Search',0)+empty('Nothing matches “'+esc(q)+'”','Try part of a route (<code>/tasks</code>), a table (<code>users</code>), a change name, or a file path. <kbd>Esc</kbd> clears the search.');
  let h=lhead('Search',ids.length,'<span class="lh">grouped by kind</span>');
  // A row that matched on its file or description says so; the name alone would look
  // like an unexplained hit.
  const why=id=>{
    const n=ix.get(id);
    if(!n||matches(n.n))return '';
    if(n.f&&matches(n.f))return esc(n.f+(n.l?':'+n.l:''));
    if(n.d&&matches(n.d))return esc(plain(n.d));
    return '';
  };
  for(const k of ORDER){
    const bag=ids.filter(id=>kindOf(id)===k);
    if(!bag.length)continue;
    h+=grp(KINDS[k],String(bag.length));
    h+=bag.slice(0,30).map(id=>row(id,'',[why(id)||(k==='change'?'':esc(descOf(ix.get(id))))])).join('');
    if(bag.length>30)h+='<details class="grpwrap"><summary class="moresum">Show all '+bag.length+'</summary>'+bag.slice(30).map(id=>row(id,'',[])).join('')+'</details>';
  }
  return h;
}
function findIntro(){
  const n=findIds().length;
  return '<div class="intro"><h1 tabindex="-1">Search</h1><p>'+n+(n===1?' match':' matches')+' for “'+esc(q)+'”, grouped by kind on the left. Open one to see where it sits on the line. <kbd>Esc</kbd> clears the search.</p></div>';
}

/* ---------------------------------------------------------------- events */
$('#tabs').addEventListener('click',e=>{
  const a=e.target.closest('a');
  if(!a)return;
  if(q){q='';$('#q').value=''}
  if(location.hash===a.getAttribute('href')){sel=null;readHash();render()}
});
$('#crumbs').addEventListener('click',e=>{
  const a=e.target.closest('a');
  if(!a)return;
  const href=a.getAttribute('href');
  if(href==='#search'){e.preventDefault();sel=null;render();return}
  if(q){q='';$('#q').value=''}
  if(location.hash===href){sel=null;readHash();render()}
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();sel=null;render()});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const first=$('#list [data-go]');if(first){e.preventDefault();focusSel=true;first.click()}}
  if(e.key==='ArrowDown'){const first=$('#list [data-go]');if(first){e.preventDefault();first.focus()}}
});
$('#proj').addEventListener('change',e=>load(Number(e.target.value)));
$('#list').addEventListener('click',e=>{
  const t=e.target.closest('#untested');
  if(t){untestedOnly=!untestedOnly;renderList();const b=$('#untested');if(b)b.focus();return}
  if(e.target.closest('[data-go]'))fromList=true;
});
$('#main').addEventListener('click',e=>{
  const m=e.target.closest('[data-more]');
  if(m){
    const box=m.parentElement,open=m.getAttribute('aria-expanded')!=='true';
    box.classList.toggle('open',open);
    m.setAttribute('aria-expanded',String(open));
    m.textContent=open?'Show fewer':'Show all '+m.dataset.n;
    return;
  }
  const b=e.target.closest('.path');
  if(!b)return;
  const text=b.dataset.path||'',label=b.dataset.label||text;
  try{navigator.clipboard.writeText(text)}catch(err){}
  $('#live').textContent=text+' copied';
  b.textContent='Copied '+label;
  b.classList.add('copied');
  setTimeout(()=>{b.textContent=label;b.classList.remove('copied')},1400);
});
$('#list').addEventListener('keydown',e=>{
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  const items=[...document.querySelectorAll('#list [data-go]')];
  if(!items.length)return;
  e.preventDefault();
  const at=items.indexOf(document.activeElement);
  const next=items[Math.min(items.length-1,Math.max(0,at<0?0:at+(e.key==='ArrowDown'?1:-1)))];
  focusSel=true;fromList=true;next.click();
});
// Escape walks up one level: search, then the item, then back to Today.
addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  const typing=tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA';
  if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus();$('#q').select();return}
  if(e.key!=='Escape')return;
  if(q){
    q='';$('#q').value='';
    if(location.hash.indexOf('#node/')===0){sel=null;location.hash=place==='map'?'#map/'+lane:'#'+place}
    else render();
  } else if(sel){
    sel=null;location.hash=place==='map'?'#map/'+lane:'#'+place;
  }
  $('#q').blur();
});
addEventListener('hashchange',()=>{readHash();render()});

/* ---------------------------------------------------------------- theme */
const THEMES=['auto','light','dark'];
let theme='auto';
try{const saved=localStorage.getItem('weave:theme');if(THEMES.indexOf(saved)>=0)theme=saved}catch(err){}
function applyTheme(){
  const mq=typeof matchMedia==='function'?matchMedia('(prefers-color-scheme:dark)'):{matches:false};
  const dark=theme==='dark'||(theme==='auto'&&mq.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const b=$('#theme'),l=$('#themelabel');
  if(!b)return;
  const word={auto:'Auto',light:'Light',dark:'Dark'}[theme];
  if(l)l.textContent=word;
  b.setAttribute('aria-label','Theme: '+word+'. Change theme');
}
$('#theme').addEventListener('click',()=>{
  theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];
  try{localStorage.setItem('weave:theme',theme)}catch(err){}
  applyTheme();
});
if(typeof matchMedia==='function'){
  const mq=matchMedia('(prefers-color-scheme:dark)');
  if(mq.addEventListener)mq.addEventListener('change',()=>{if(theme==='auto')applyTheme()});
}

applyTheme();
load(0);
</script>
