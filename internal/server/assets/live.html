<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weave live · {{name}}</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --line: #222733; --fg: #e6e8ee; --muted: #8a92a3; --faint: #2a303d;
    --screen: #7aa2f7; --endpoint: #e0af68; --table: #73daca; --bad: #f7768e; --good: #9ece6a; --hot: #ffd479;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f8fa; --panel: #ffffff; --line: #e3e6ec; --fg: #1d2330; --muted: #646d7e; --faint: #dfe3ea;
      --screen: #3b6fd8; --endpoint: #b7791f; --table: #1f9a8a; --bad: #d23a54; --good: #3f8f2a; --hot: #c98a00;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header h1 span { color: var(--muted); font-weight: 500; }
  header a { color: var(--muted); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--fg); }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; font-weight: 600; font-size: 13px; border: 1px solid var(--line); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.ok i { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
  .pill.bad i { background: var(--bad); box-shadow: 0 0 10px var(--bad); animation: blink 1s infinite; }
  .pill.idle i { background: var(--muted); }
  .scope { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .watch { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .watch i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); animation: blink 2s infinite; }
  main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  svg { width: 100%; height: 100%; display: block; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
  .files, .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .files li { font: 12px var(--mono); overflow-wrap: anywhere; color: var(--fg); }
  .log li { font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: color-mix(in srgb, var(--faint) 45%, transparent); animation: slide .35s ease-out; }
  .log li time { color: var(--muted); font: 11px var(--mono); margin-right: 6px; }
  .log li.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); }
  .log li.good { background: color-mix(in srgb, var(--good) 18%, transparent); }
  .broken { border: 1px solid color-mix(in srgb, var(--bad) 55%, transparent); border-radius: 10px; padding: 9px 10px; }
  .broken b { font: 600 13px var(--mono); color: var(--bad); }
  .broken div { font-size: 12.5px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .broken div em { font-style: normal; color: var(--good); font-family: var(--mono); }
  .tests { font: 12px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  #toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(-12px); opacity: 0; transition: all .35s; padding: 9px 16px; border-radius: 999px; font-weight: 650; pointer-events: none; }
  #toast.on { opacity: 1; transform: translateX(-50%); }
  #toast.good { background: var(--good); color: #0b1a05; box-shadow: 0 6px 30px color-mix(in srgb, var(--good) 45%, transparent); }
  #toast.bad { background: var(--bad); color: #24060c; box-shadow: 0 6px 30px color-mix(in srgb, var(--bad) 45%, transparent); }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; display: none; max-width: 360px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #tip small { display: block; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
  .col-title { font: 600 11px system-ui; letter-spacing: .1em; text-transform: uppercase; fill: var(--muted); }
  .node rect { rx: 4; }
  .node text { font: 11px var(--mono); fill: var(--muted); dominant-baseline: middle; }
  .node.hot text, .node.bad text, .node.good text { fill: var(--fg); font-weight: 600; }
  .mod { font: 10px var(--mono); fill: var(--muted); opacity: .7; }
  .link { fill: none; stroke: var(--faint); stroke-width: 1; opacity: .5; transition: opacity .4s; }
  .dim .link { opacity: .12; }
  .dim .node:not(.hot):not(.bad):not(.good) { opacity: .38; }
  .node { transition: opacity .4s; }
  .link.hot { stroke: var(--hot); opacity: .95; stroke-width: 1.6; }
  .link.bad { stroke: var(--bad); opacity: 1; stroke-width: 1.8; stroke-dasharray: 5 4; animation: dash 1s linear infinite; }
  .link.mean { stroke: var(--good); opacity: 1; stroke-width: 2; stroke-dasharray: 2 4; animation: dash 1.4s linear infinite; }
  .node.hot rect { filter: drop-shadow(0 0 6px var(--hot)); }
  .node.bad rect { filter: drop-shadow(0 0 8px var(--bad)); animation: pulse 1.2s ease-in-out infinite; }
  .node.good rect { filter: drop-shadow(0 0 10px var(--good)); }
  .node.new rect { animation: pop .6s ease-out; }
  @keyframes dash { to { stroke-dashoffset: -18; } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes pulse { 50% { opacity: .55; } }
  @keyframes pop { 0% { transform: scale(1.06); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes slide { from { opacity: 0; transform: translateY(-6px); } }
  .node rect { transform-box: fill-box; transform-origin: center; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } aside { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
</style>
</head>
<body>
<header>
  <h1>weave live <span>· {{name}}</span></h1>
  <span id="pill" class="pill idle"><i></i><span>Reading the map…</span></span>
  <span id="scope" class="scope"></span>
  <span class="spacer"></span>
  <span class="legend"><span style="--c:var(--screen)">screen</span><span style="--c:var(--endpoint)">endpoint</span><span style="--c:var(--table)">table</span><span style="--c:var(--hot)">reached by the change</span><span style="--c:var(--bad)">broken</span></span>
  <span class="watch"><i></i>watching the working tree</span>
  <a href="./">← panel</a>
</header>
<main>
  <div id="stage"><svg id="svg" role="img" aria-label="The app's screens, endpoints and tables, lit up by the uncommitted change"></svg><div id="toast"></div><div id="tip"></div></div>
  <aside>
    <section><h2>Broken calls</h2><div id="broken"><p class="empty">None.</p></div></section>
    <section><h2>Changed files</h2><ul id="files" class="files"><li class="empty">No uncommitted change.</li></ul></section>
    <section><h2>Tests to run</h2><pre id="tests" class="tests">—</pre></section>
    <section><h2>What happened</h2><ul id="log" class="log"></ul></section>
  </aside>
</main>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  const $ = (id) => document.getElementById(id);
  const s = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.append(n); return n; };
  const h = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const api = (p) => fetch(p, { cache: 'no-store' }).then((r) => r.json());

  let map = null, state = null, prev = null;
  const pos = new Map(); // "s:" | "e:" | "t:" + name -> {x, y, w, h, g}

  // ------------------------------------------------------------ layout
  const draw = () => {
    if (!map) return;
    svg.replaceChildren();
    pos.clear();
    const W = svg.clientWidth || 1000, H = svg.clientHeight || 700;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const top = 44, bottom = 18;
    const ghosts = (state?.blast?.broken ?? []).map((b) => b.gone).filter((g) => !map.endpoints.some((e) => e.name === g));
    const cols = [
      { key: 's', title: `Screens (${map.screens.length})`, items: map.screens, color: 'var(--screen)' },
      { key: 'e', title: `Endpoints (${map.endpoints.length})`, items: [...ghosts.map((g) => ({ name: g, ghost: true })), ...map.endpoints], color: 'var(--endpoint)' },
      { key: 't', title: `Tables (${map.tables.length})`, items: map.tables, color: 'var(--table)' },
    ];
    const colW = Math.min(300, (W - 80) / 3.2);
    const xs = [24, W / 2 - colW / 2, W - colW - 24];
    const linkLayer = s('g', { class: 'links' }, svg);
    const nodeLayer = s('g', {}, svg);
    cols.forEach((c, ci) => {
      s('text', { x: xs[ci], y: 22, class: 'col-title' }, nodeLayer).textContent = c.title;
      const n = Math.max(1, c.items.length);
      const rowH = Math.min(26, (H - top - bottom) / n);
      const boxH = Math.max(2, rowH - (rowH > 8 ? 4 : 1));
      let lastMod = null;
      c.items.forEach((it, i) => {
        const y = top + i * rowH;
        const g = s('g', { class: 'node' + (it.ghost ? ' bad' : '') }, nodeLayer);
        const w = rowH >= 11 ? colW : Math.max(6, colW * 0.18);
        s('rect', { x: xs[ci], y, width: w, height: boxH, fill: it.ghost ? 'var(--bad)' : c.color, 'fill-opacity': it.ghost ? .25 : .16, stroke: it.ghost ? 'var(--bad)' : c.color, 'stroke-opacity': .7, 'stroke-dasharray': it.ghost ? '4 3' : '' }, g);
        const label = s('text', { x: xs[ci] + (rowH >= 11 ? 8 : w + 6), y: y + boxH / 2 }, g);
        label.textContent = it.ghost ? `${it.name}  (removed)` : it.name;
        if (rowH < 11) label.style.display = 'none';
        if (c.key === 'e' && it.module && it.module !== lastMod && rowH >= 9) {
          s('text', { x: xs[ci] - 6, y: y + boxH / 2, class: 'mod', 'text-anchor': 'end' }, nodeLayer).textContent = it.module;
        }
        lastMod = it.module;
        g.addEventListener('mousemove', (ev) => tip(ev, it, c.key));
        g.addEventListener('mouseleave', () => { $('tip').style.display = 'none'; });
        pos.set(c.key + ':' + it.name, { x: xs[ci], y, w, h: boxH, g, label, small: rowH < 11 });
      });
    });
    // links: screen → endpoint, endpoint → table
    const curve = (a, b) => {
      const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, dx = (x2 - x1) / 2;
      return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    };
    const links = [];
    for (const [sc, ep] of map.calls) { const a = pos.get('s:' + sc), b = pos.get('e:' + ep); if (a && b) links.push({ from: 's:' + sc, to: 'e:' + ep, el: s('path', { d: curve(a, b), class: 'link' }, linkLayer) }); }
    for (const [ep, t] of map.uses) { const a = pos.get('e:' + ep), b = pos.get('t:' + t); if (a && b) links.push({ from: 'e:' + ep, to: 't:' + t, el: s('path', { d: curve(a, b), class: 'link' }, linkLayer) }); }
    // the broken calls and the route each one meant
    for (const b of state?.blast?.broken ?? []) {
      const ghost = pos.get('e:' + b.gone);
      for (const sc of b.screens) { const a = pos.get('s:' + sc); if (a && ghost) s('path', { d: curve(a, ghost), class: 'link bad' }, linkLayer); }
      const mean = pos.get('e:' + b.closest);
      if (ghost && mean && mean !== ghost) {
        const x = ghost.x + ghost.w, y1 = ghost.y + ghost.h / 2, y2 = mean.y + mean.h / 2;
        s('path', { d: `M${ghost.x + ghost.w},${y1} C${x + 26},${y1} ${x + 26},${y2} ${mean.x + mean.w},${y2}`, class: 'link mean' }, linkLayer);
      }
    }
    svg.__links = links;
    paint();
  };

  // ------------------------------------------------------------ highlight
  const paint = () => {
    if (!map || !state) return;
    const b = state.blast;
    const hot = new Set([...b.screens.map((x) => 's:' + x), ...b.endpoints.map((x) => 'e:' + x), ...b.tables.map((x) => 't:' + x)]);
    const bad = new Set(b.broken.flatMap((x) => ['e:' + x.gone, ...x.screens.map((sc) => 's:' + sc)]));
    const was = new Set(prev ? [...prev.blast.screens.map((x) => 's:' + x), ...prev.blast.endpoints.map((x) => 'e:' + x), ...prev.blast.tables.map((x) => 't:' + x)] : []);
    const good = new Set((prev?.blast?.broken ?? []).filter((x) => !b.broken.some((y) => y.gone === x.gone)).map((x) => 'e:' + x.closest));
    svg.classList.toggle('dim', hot.size + bad.size > 0);
    for (const [k, p] of pos) {
      const cls = bad.has(k) ? 'bad' : good.has(k) ? 'good' : hot.has(k) ? 'hot' : '';
      p.g.setAttribute('class', 'node ' + cls + (cls && !was.has(k) && prev ? ' new' : ''));
      if (p.small) p.label.style.display = cls ? '' : 'none';
      const rect = p.g.querySelector('rect');
      if (cls === 'hot') { rect.setAttribute('fill', 'var(--hot)'); rect.setAttribute('fill-opacity', .32); rect.setAttribute('stroke', 'var(--hot)'); }
      else if (cls === 'bad') { rect.setAttribute('fill', 'var(--bad)'); rect.setAttribute('fill-opacity', .26); rect.setAttribute('stroke', 'var(--bad)'); }
      else if (cls === 'good') { rect.setAttribute('fill', 'var(--good)'); rect.setAttribute('fill-opacity', .35); rect.setAttribute('stroke', 'var(--good)'); }
    }
    for (const l of svg.__links ?? []) {
      const on = hot.has(l.from) && hot.has(l.to);
      l.el.setAttribute('class', 'link' + (on ? ' hot' : ''));
    }
  };

  const tip = (ev, it, key) => {
    const t = $('tip');
    t.replaceChildren(h('div', '', `${{ s: 'screen', e: 'endpoint', t: 'table' }[key]} ${it.name}`));
    if (it.file) t.append(h('small', '', it.file));
    const r = svg.getBoundingClientRect();
    t.style.display = 'block';
    t.style.left = Math.min(ev.clientX - r.left + 14, r.width - 300) + 'px';
    t.style.top = ev.clientY - r.top + 12 + 'px';
  };

  // ------------------------------------------------------------ side panel
  const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const log = (text, tone) => {
    const li = h('li', tone || '');
    li.append(h('time', '', now()), document.createTextNode(text));
    $('log').prepend(li);
    while ($('log').children.length > 12) $('log').lastChild.remove();
  };
  const toast = (text, tone) => {
    const t = $('toast');
    t.textContent = text; t.className = 'on ' + tone;
    clearTimeout(t.__t); t.__t = setTimeout(() => { t.className = tone; }, 2600);
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  const side = () => {
    const st = state, b = st.blast;
    const pill = $('pill');
    if (st.error) { pill.className = 'pill bad'; pill.lastChild.textContent = st.error; return; }
    pill.className = 'pill ' + (st.ok ? (st.changes.length ? 'ok' : 'idle') : 'bad');
    pill.lastChild.textContent = !st.ok ? `${plural(Math.max(1, b.broken.length), 'broken call')}` : st.changes.length ? 'Gate passes' : 'No change yet';
    $('scope').textContent = st.changes.length ? `${plural(st.changes.length, 'file')} → ${plural(b.screens.length, 'screen')}, ${plural(b.endpoints.length, 'endpoint')}, ${plural(b.tables.length, 'table')}` : 'Edit a file and watch what it reaches.';
    const files = $('files'); files.replaceChildren();
    if (!st.changes.length) files.append(h('li', 'empty', 'No uncommitted change.'));
    for (const f of st.changes.slice(0, 40)) files.append(h('li', '', f));
    const br = $('broken'); br.replaceChildren();
    if (!b.broken.length) br.append(h('p', 'empty', st.ok ? 'None.' : st.errors.join('\n')));
    for (const x of b.broken) {
      const box = h('div', 'broken');
      box.append(h('b', '', x.gone));
      box.append(h('div', '', `still called from ${x.caller}, ${plural(x.screens.length, 'screen')} lose it`));
      if (x.closest) { const d = h('div', '', 'did you mean '); d.append(h('em', '', x.closest)); box.append(d); }
      br.append(box);
    }
    $('tests').textContent = st.commands.length ? st.commands.join('\n') : '—';
  };

  const narrate = () => {
    const st = state, b = st.blast;
    if (!prev) {
      log(st.changes.length ? `Watching. The change reaches ${plural(b.endpoints.length, 'endpoint')} and ${plural(b.screens.length, 'screen')}.` : 'Watching. Nothing changed since the last commit.');
      if (!st.ok && b.broken.length) log(`${b.broken.map((x) => x.gone).join(', ')} is gone but still called.`, 'bad');
      return;
    }
    const newFiles = st.changes.filter((f) => !prev.changes.includes(f));
    const what = newFiles.length ? newFiles.map((f) => f.split('/').pop()).join(', ') : st.changes.length ? 'An edit' : 'The tree';
    const gone = b.broken.filter((x) => !prev.blast.broken.some((y) => y.gone === x.gone));
    const fixed = prev.blast.broken.filter((x) => !b.broken.some((y) => y.gone === x.gone));
    if (gone.length) {
      for (const x of gone) log(`${what}: ${x.gone} removed while ${plural(x.screens.length, 'screen')} still call it${x.closest ? `. Did you mean ${x.closest}?` : '.'}`, 'bad');
      toast(`${gone[0].gone} broke ${plural(gone[0].screens.length, 'screen')}`, 'bad');
    } else if (fixed.length) {
      log(`${what}: fixed. ${fixed.map((x) => x.gone).join(', ')} is no longer called. The gate passes.`, 'good');
      toast('Fixed: the gate passes', 'good');
    } else if (!st.changes.length && prev.changes.length) {
      log('Committed or reverted: nothing uncommitted.');
    } else {
      const pb = prev.blast;
      if (!newFiles.length && pb.endpoints.length === b.endpoints.length && pb.screens.length === b.screens.length && pb.tables.length === b.tables.length) return;
      log(`${what}${newFiles.length ? " changed" : ""} → ${plural(b.endpoints.length, 'endpoint')}, ${plural(b.screens.length, 'screen')}, ${plural(b.tables.length, 'table')}.`);
    }
  };

  // ------------------------------------------------------------ loop
  const loadMap = async () => { map = await api('api/live/map'); };
  const loop = async () => {
    let since = '';
    for (;;) {
      try {
        const st = await api('api/live?since=' + encodeURIComponent(since));
        if (st.print !== since) {
          prev = state; state = st; since = st.print;
          if (!map || (st.builtAt && st.builtAt !== map.builtAt)) await loadMap();
          draw(); side(); narrate();
        }
      } catch (e) {
        $('pill').className = 'pill bad'; $('pill').lastChild.textContent = 'weave serve stopped';
        await new Promise((r) => setTimeout(r, 3000));
      }
    }
  };
  addEventListener('resize', () => { clearTimeout(draw.__t); draw.__t = setTimeout(draw, 120); });
  loop();
})();
</script>
</body>
</html>
